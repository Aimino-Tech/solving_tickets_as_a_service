global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "syntaro-bot"
    static_configs: [{ targets: ["syntaro-bot:3000"], labels: { service: "syntaro-bot" } }]
    metrics_path: /metrics
  - job_name: "syntaro-worker"
    static_configs: [{ targets: ["syntaro-worker:3000"], labels: { service: "syntaro-worker" } }]
    metrics_path: /metrics
  - job_name: "redis"
    static_configs: [{ targets: ["syntaro-redis:6379"] }]
  - job_name: "nginx"
    static_configs: [{ targets: ["syntaro-nginx:80"] }]
