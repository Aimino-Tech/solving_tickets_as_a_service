# =============================================================================
# SYNTARO — Production Docker Compose Stack
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml up -d --scale syntaro-worker=4
#
# Requires a .env file with all required environment variables.
# See .env.example for the full list.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

x-resources-webhook: &resources-webhook
  resources:
    limits:
      memory: 512M
      cpus: "0.5"

x-resources-worker: &resources-worker
  resources:
    limits:
      memory: 1G
      cpus: "1"

x-resources-light: &resources-light
  resources:
    limits:
      memory: 256M
      cpus: "0.2"

x-healthcheck-redis: &healthcheck-redis
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 10s

x-healthcheck-rabbitmq: &healthcheck-rabbitmq
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

x-healthcheck-postgres: &healthcheck-postgres
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syntaro} -d ${POSTGRES_DB:-syntaro}"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — primary database for the hosted service
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: syntaro-postgres
    <<: *default-restart
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syntaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syntaro-password}
      POSTGRES_DB: ${POSTGRES_DB:-syntaro}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    <<: *healthcheck-postgres
    <<: *resources-light
    logging: *default-logging
    networks:
      - syntaro-net

  # ---------------------------------------------------------------------------
  # Redis — Celery backend + caching + BullMQ job queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: syntaro-redis
    <<: *default-restart
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size 64mb
    volumes:
      - redis-data:/data
    <<: *healthcheck-redis
    <<: *resources-light
    logging: *default-logging
    networks:
      - syntaro-net

  # ---------------------------------------------------------------------------
  # RabbitMQ — message broker for Celery workers and cross-service bridge
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: syntaro-rabbitmq
    <<: *default-restart
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-syntaro-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-syntaro-app-password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/syntaro}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    <<: *healthcheck-rabbitmq
    <<: *resources-light
    logging: *default-logging
    networks:
      - syntaro-net

  # ---------------------------------------------------------------------------
  # SYNTARO Webhook — Express.js API server (scalable horizontally)
  # ---------------------------------------------------------------------------
  syntaro-webhook:
    build:
      context: .
      dockerfile: Dockerfile
    image: syntaro-webhook:latest
    container_name: syntaro-webhook
    <<: *default-restart
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - RUN_MODE=api
      - REDIS_URL=redis://syntaro-redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-syntaro-app}:${RABBITMQ_PASSWORD:-syntaro-app-password}@syntaro-rabbitmq:5672${RABBITMQ_VHOST:-/syntaro}
      - DATABASE_URL=postgres://${POSTGRES_USER:-syntaro}:${POSTGRES_PASSWORD:-syntaro-password}@syntaro-postgres:5432/${POSTGRES_DB:-syntaro}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Graceful shutdown — allow in-flight webhook processing to complete
    stop_grace_period: 30s
    <<: *resources-webhook
    logging: *default-logging
    networks:
      - syntaro-net

  # ---------------------------------------------------------------------------
  # SYNTARO Worker — Celery worker that processes issue queues (scalable)
  # ---------------------------------------------------------------------------
  syntaro-worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    image: syntaro-worker:latest
    container_name: syntaro-worker
    <<: *default-restart
    command: celery -A workers.celery_app worker -l info -Q syntaro.agents.triage,syntaro.agents.dispatch,syntaro.agents.sandbox,syntaro.agents.verification,syntaro.agents.pr_creation,syntaro.agents.notifications --concurrency=4
    env_file: .env
    environment:
      - REDIS_URL=redis://syntaro-redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-syntaro-app}:${RABBITMQ_PASSWORD:-syntaro-app-password}@syntaro-rabbitmq:5672${RABBITMQ_VHOST:-/syntaro}
      - DATABASE_URL=postgres://${POSTGRES_USER:-syntaro}:${POSTGRES_PASSWORD:-syntaro-password}@syntaro-postgres:5432/${POSTGRES_DB:-syntaro}
      - PGPoolSize=50
      - PGMAXClientConnections=75
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-syntaro-app}:${RABBITMQ_PASSWORD:-syntaro-app-password}@syntaro-rabbitmq:5672${RABBITMQ_VHOST:-/syntaro}
      - CELERY_RESULT_BACKEND=redis://syntaro-redis:6379/0
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "/app/workers/health.py", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Graceful shutdown — allow running tasks to finish before SIGKILL
    stop_grace_period: 60s
    <<: *resources-worker
    logging: *default-logging
    networks:
      - syntaro-net

  # ---------------------------------------------------------------------------
  # Celery Beat — periodic task scheduler
  # ---------------------------------------------------------------------------
  celery-beat:
    image: syntaro-worker:latest
    container_name: syntaro-celery-beat
    <<: *default-restart
    command: celery -A workers.celery_app beat -l info
    env_file: .env
    environment:
      - REDIS_URL=redis://syntaro-redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-syntaro-app}:${RABBITMQ_PASSWORD:-syntaro-app-password}@syntaro-rabbitmq:5672${RABBITMQ_VHOST:-/syntaro}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-syntaro-app}:${RABBITMQ_PASSWORD:-syntaro-app-password}@syntaro-rabbitmq:5672${RABBITMQ_VHOST:-/syntaro}
      - CELERY_RESULT_BACKEND=redis://syntaro-redis:6379/0
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Graceful shutdown — allow beat to save schedule state
    stop_grace_period: 15s
    <<: *resources-light
    logging: *default-logging
    networks:
      - syntaro-net

  # ---------------------------------------------------------------------------
  # Flower — Celery monitoring dashboard
  # ---------------------------------------------------------------------------
  flower:
    image: mher/flower:latest
    container_name: syntaro-flower
    <<: *default-restart
    ports:
      - "5555:5555"
    command: flower --port=5555 --broker=amqp://${RABBITMQ_USER:-syntaro-app}:${RABBITMQ_PASSWORD:-syntaro-app-password}@syntaro-rabbitmq:5672${RABBITMQ_VHOST:-/syntaro}
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-syntaro-app}:${RABBITMQ_PASSWORD:-syntaro-app-password}@syntaro-rabbitmq:5672${RABBITMQ_VHOST:-/syntaro}
      - CELERY_RESULT_BACKEND=redis://syntaro-redis:6379/0
      - FLOWER_PORT=5555
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    <<: *resources-light
    logging: *default-logging
    networks:
      - syntaro-net

  # ---------------------------------------------------------------------------
  # Nginx — reverse proxy with TLS termination and load balancing
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: syntaro-nginx
    <<: *default-restart
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - htpasswd-data:/etc/nginx/.htpasswd:ro
    depends_on:
      syntaro-webhook:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *resources-light
    logging: *default-logging
    networks:
      - syntaro-net

  # ---------------------------------------------------------------------------
  # SYNTARO Dashboard — React/Vite frontend for the hosted service
  # ---------------------------------------------------------------------------
  syntaro-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: syntaro-dashboard:latest
    container_name: syntaro-dashboard
    <<: *default-restart
    ports:
      - "5173:80"
    env_file: .env
    environment:
      - VITE_API_URL=http://syntaro-webhook:3000
      - NODE_ENV=production
    depends_on:
      syntaro-webhook:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    <<: *resources-light
    logging: *default-logging
    networks:
      - syntaro-net

  # ---------------------------------------------------------------------------
  # Certbot — automatic TLS certificate provisioning with Let's Encrypt
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: syntaro-certbot
    <<: *default-restart
    entrypoint: ""
    command: >
      sh -c "
        trap 'exit 0' TERM;
        while :; do
          certbot renew --webroot -w /var/www/html --quiet --non-interactive;
          sleep 86400;
        done
      "
    volumes:
      - certbot-www:/var/www/html
      - certbot-etc:/etc/letsencrypt
    depends_on:
      - nginx
    logging: *default-logging
    networks:
      - syntaro-net

  # ---------------------------------------------------------------------------
  # Backup Cron — scheduled database and queue backups
  # ---------------------------------------------------------------------------
  syntaro-backup:
    image: syntaro-webhook:latest
    container_name: syntaro-backup
    <<: *default-restart
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "0 */6 * * * /app/scripts/backup-postgres.sh" > /etc/crontabs/root
        echo "0 */12 * * * /app/scripts/backup-redis.sh" >> /etc/crontabs/root
        echo "0 */12 * * * /app/scripts/backup-rabbitmq.sh" >> /etc/crontabs/root
        crond -f -l 2
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-syntaro}:${POSTGRES_PASSWORD:-syntaro-password}@syntaro-postgres:5432/${POSTGRES_DB:-syntaro}
      - REDIS_URL=redis://syntaro-redis:6379
      - BACKUP_DIR=/backups
    volumes:
      - backup-data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    <<: *resources-light
    logging: *default-logging
    networks:
      - syntaro-net

  # ---------------------------------------------------------------------------
  # Nginx Setup — generates htpasswd file for Flower auth
  # ---------------------------------------------------------------------------
  nginx-setup:
    image: nginx:alpine
    container_name: syntaro-nginx-setup
    restart: "no"
    entrypoint: >
      sh -c "
        apk add --no-cache apache2-utils &&
        htpasswd -b -c /etc/nginx/.htpasswd '${FLOWER_USER:-admin}' '${FLOWER_PASSWORD:-syntaro-flower-admin}' &&
        echo 'htpasswd generated'
      "
    volumes:
      - htpasswd-data:/etc/nginx
    logging: *default-logging
    networks:
      - syntaro-net

  # ---------------------------------------------------------------------------
  # SYNTARO Egress Proxy — Squid-based zero-trust egress proxy for sandbox isolation
  # ---------------------------------------------------------------------------
  syntaro-egress-proxy:
    build:
      context: ./docker/squid
      dockerfile: Dockerfile
    image: syntaro-egress-proxy:latest
    container_name: syntaro-egress-proxy
    <<: *default-restart
    ports:
      - "3128:3128"
    environment:
      ALLOWED_DOMAINS: ${DOCKER_ALLOWED_HOSTS:-api.github.com,github.com,raw.githubusercontent.com,registry.npmjs.org,pypi.org,files.pythonhosted.org,proxy.golang.org,index.crates.io,crates.io}
    networks:
      - syntaro-net
      - syntaro_agent-net
    healthcheck:
      test: ["CMD", "squidclient", "-h", "127.0.0.1", "http://localhost:3128"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *resources-light
    logging: *default-logging


  loki:
    image: grafana/loki:3.0.0
    container_name: syntaro-loki
    <<: *default-restart
    ports:
      - "3100:3100"
      - "9096:9096"
    volumes:
      - ./deploy/monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    <<: *resources-light
    logging: *default-logging
    networks:
      - syntaro-net

  promtail:
    image: grafana/promtail:3.0.0
    container_name: syntaro-promtail
    <<: *default-restart
    volumes:
      - ./deploy/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    <<: *resources-light
    logging: *default-logging
    networks:
      - syntaro-net

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  certbot-www:
    driver: local
  certbot-etc:
    driver: local
  backup-data:
    driver: local
  htpasswd-data:
    driver: local
  loki-data:
    driver: local

networks:
  syntaro-net:
    driver: bridge
    name: syntaro-prod-net
  syntaro_agent-net:
    driver: bridge
    internal: false
    name: syntaro_agent-net
