name: 'SYNTARO — Auto Fix Issues'
description: 'Label an issue with syntaro:fix and get a pull request with the fix automatically'
author: 'Aimino Tech'
branding:
  icon: 'check-square'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token with contents:write, issues:write, pull_requests:write permissions'
    required: true
  opencode-url:
    description: 'OpenCode Serve URL'
    required: false
    default: 'http://localhost:4096'
  opencode-api-key:
    description: 'OpenCode API key'
    required: false
  opencode-model:
    description: 'OpenCode model to use for the fix agent'
    required: false
    default: 'anthropic/claude-sonnet-4-20250514'
  openai-api-key:
    description: 'OpenAI API key (fallback if OpenCode is not available)'
    required: false
  bot-name:
    description: 'Bot name used in comments'
    required: false
    default: 'SYNTARO'

runs:
  using: 'composite'
  steps:
    - name: Post "working on it" comment
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const body = [
            '## 🔄 SYNTARO is on it',
            '',
            '**Issue:** ' + context.payload.issue.title,
            '',
            '| Step | Status |',
            '|------|--------|',
            '| 📥 Received | ✅ |',
            '| 🔍 Investigating | ⏳ |',
            '| ✏️ Writing fix | ⏳ |',
            '| 🧪 Verifying | ⏳ |',
            '| 📬 Creating PR | ⏳ |',
            '',
            'I\'ll investigate, fix, and open a draft PR. This takes a few minutes.',
          ].join('\n');
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body,
          });

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.github-token }}
        fetch-depth: 0
        ref: ${{ github.event.repository.default_branch }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Run SYNTARO fix agent
      shell: bash
      run: npx tsx ${{ github.action_path }}/../../../scripts/syntaro-action.ts
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        BASE_BRANCH: ${{ github.event.repository.default_branch }}
        OPENCODE_URL: ${{ inputs.opencode-url }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
        OPENCODE_MODEL: ${{ inputs.opencode-model }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        BOT_NAME: ${{ inputs.bot-name }}
