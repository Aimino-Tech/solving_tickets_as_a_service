name: ✨ Feature Request
description: Suggest an idea for SYNTARO
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see added to SYNTARO and why it would be valuable.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution
      description: A clear and concise description of what you want to happen.
      placeholder: "I'd like SYNTARO to support..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: "I've also considered..."
    validations:
      required: false

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: How would this feature benefit you or your team?
      placeholder: "As a developer, I want to..."
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Target Tier
      description: Which SYNTARO tier is this feature relevant to?
      options:
        - Self-hosted (OSS)
        - Cloud Free
        - Cloud Paid (Solo / Team)
        - Enterprise
        - All tiers
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
