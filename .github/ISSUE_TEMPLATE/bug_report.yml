name: 🐛 Bug Report
description: Report a bug to help us improve SYNTARO
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      description: The URL of the repository where you encountered the issue (if applicable).
      placeholder: "https://github.com/owner/repo"
    validations:
      required: false

  - type: input
    id: issue_url
    attributes:
      label: Issue URL
      description: The URL of the issue that SYNTARO was attempting to fix (if applicable).
      placeholder: "https://github.com/owner/repo/issues/123"
    validations:
      required: false

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "SYNTARO should have created a PR with a fix..."
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: "SYNTARO did not respond to the label, or the fix was incorrect..."
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Create an issue with label `syntaro:fix`
        2. Wait for SYNTARO to respond
        3. Observe the error
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code.
      render: shell
      placeholder: "SYNTARO server logs, webhook logs, or error messages..."
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      description: How are you running SYNTARO?
      options:
        - Self-hosted (Docker)
        - Self-hosted (Railway)
        - Self-hosted (Fly.io)
        - Self-hosted (Kubernetes)
        - Self-hosted (manual)
        - Cloud Free tier
        - Cloud Paid tier
        - RapidAPI
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SYNTARO Version
      description: What version of SYNTARO are you running? Check your `package.json` or Docker image tag.
      placeholder: "v0.11.0"
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: What environment are you running in?
      options:
        - Production
        - Staging
        - Development / Local
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, configuration, etc.)
    validations:
      required: false
