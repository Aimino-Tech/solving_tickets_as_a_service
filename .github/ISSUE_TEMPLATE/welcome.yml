name: Welcome to SYNTARO
description: First issue auto-created when SYNTARO is installed on a repository
title: "🎉 Welcome! SYNTARO is ready to fix your issues"
labels: [syntaro:fix, good-first-issue]
body:
  - type: markdown
    attributes:
      value: |
        ## 🎉 SYNTARO is now active on this repository!

        **SYNTARO** is installed and ready to help.

        ### How it works

        1. **Create an issue** describing a bug or desired change
        2. **Label it** with `syntaro:fix`
        3. **SYNTARO investigates**, generates a fix, runs tests, and opens a PR

        ### Try it now

        This issue is already labeled with `syntaro:fix`. Watch what happens next — SYNTARO
        should automatically investigate and open a pull request with a fix.

        ### Tips for best results

        - Be specific in your bug description (include error messages, steps to reproduce)
        - Link to relevant code or files
        - For feature requests, describe the expected behavior clearly

        ---

        > 🚀 **Powered by [SYNTARO](https://syntaro.io?ref=welcome-issue)** — Label any issue with `syntaro:fix` and get an AI-generated PR.
