# =============================================================================
# STAS Website — Deploy to Production
#
# Triggered on:
#   - Push to main (changes to website/)
#   - Manual workflow_dispatch
#
# Deploys to:
#   - Fly.io (stas-website app)
#   - GitHub Container Registry (for backup/hosting flexibility)
# =============================================================================

name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Deployment target"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-website
  FLY_APP_NAME: stas-website

jobs:
  ##############################################################################
  # BUILD & PUSH DOCKER IMAGE TO GHCR
  ##############################################################################
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./website
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          hide-progress: true

  ##############################################################################
  # DEPLOY TO FLY.IO
  ##############################################################################
  deploy-fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_env == 'production' }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app ${{ env.FLY_APP_NAME }} --dockerfile website/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  ##############################################################################
  # DEPLOY TO STAGING (optional)
  ##############################################################################
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: ${{ github.event.inputs.deploy_env == 'staging' }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy staging
        run: flyctl deploy --remote-only --app ${{ env.FLY_APP_NAME }}-staging --dockerfile website/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  ##############################################################################
  # NOTIFY
  ##############################################################################
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-fly]
    if: always() && needs.build-and-push.result == 'success'
    timeout-minutes: 2
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Send Slack notification
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🌐 STAS website deployed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🌐 STAS website deployed*\nRepository: `${{ github.repository }}`\nCommit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>\nSite: https://stas.aimino.io"
                  }
                }
              ]
            }

      - name: Generate summary
        run: |
          echo '### 🌐 STAS Website Deployed' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- **Site:** https://stas.aimino.io' >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_STEP_SUMMARY"
