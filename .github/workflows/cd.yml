# =============================================================================
# STAS CD — Build & Push Docker Image to GHCR
#
# Triggered on:
#   - Push to main
#   - Manual workflow_dispatch
#
# Features:
#   - Multi-platform Docker build with BuildKit cache
#   - Tagging: semver, branch, git SHA, latest
#   - GitHub Container Registry push
#   - Slack notification (success/failure)
# =============================================================================

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Slack on success
        if: success() && secrets.SLACK_WEBHOOK_URL
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ *STAS* build `${{ github.sha }}` deployed to GHCR\nTags: `${{ steps.meta.outputs.tags }}`\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
            }

      - name: Notify Slack on failure
        if: failure() && secrets.SLACK_WEBHOOK_URL
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ *STAS* build `${{ github.sha }}` failed\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
            }
