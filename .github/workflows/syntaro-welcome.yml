name: SYNTARO Welcome
on:
  repository_dispatch:
    types: [syntaro-installed]

jobs:
  create-welcome-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🎉 Welcome! SYNTARO is ready to fix your issues",
              body: [
                "## 🎉 SYNTARO is now active on this repository!",
                "",
                "**SYNTARO** is installed and ready to help.",
                "",
                "### How it works",
                "",
                "1. **Create an issue** describing a bug or desired change",
                "2. **Label it** with `syntaro:fix`",
                "3. **SYNTARO investigates**, generates a fix, runs tests, and opens a PR",
                "",
                "### Try it now",
                "",
                "This issue is already labeled with `syntaro:fix`. Watch what happens next —",
                "SYNTARO should automatically investigate and open a pull request.",
                "",
                "---",
                "",
                "> 🚀 **Powered by [SYNTARO](https://syntaro.io?ref=welcome-issue)** — Label any issue with `syntaro:fix` and get an AI-generated PR.",
              ].join("\n"),
              labels: ["syntaro:fix", "good-first-issue"],
            });
            console.log(`Welcome issue created: ${issue.data.html_url}`);
