name: STAS Automation Tests (AIM-4227)

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/automation/**"
      - "dashboard/**"
      - "src/**"
      - ".github/workflows/automation-tests.yml"
  push:
    branches: [main]
    paths:
      - "tests/automation/**"
      - "dashboard/**"
      - "src/**"
      - ".github/workflows/automation-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  STAS_URL: "http://localhost:3099"
  OSY_URL: "http://localhost:4096"

jobs:
  automation-tests:
    name: Playwright Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python test deps
        run: |
          pip install playwright pytest
          playwright install chromium

      - name: Start STAS server
        run: |
          PORT=3099 node dist/src/index.js &
          sleep 3
          for i in $(seq 1 15); do
            curl -sf http://localhost:3099/health && break
            sleep 2
          done

      - name: Run all automation tests
        run: npm run test:automation

      - name: Run health tests
        run: npm run test:automation:health

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-test-results
          path: |
            tests/automation/test-results/
            tests/automation/screenshots/
          retention-days: 7
