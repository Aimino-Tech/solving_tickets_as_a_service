name: Benchmark — Publish Results

on:
  workflow_run:
    workflows: ["Benchmarks (Daily)"]
    types:
      - completed
  workflow_dispatch:
    # Allow manual trigger

env:
  NODE_VERSION: "22"

jobs:
  publish:
    name: Publish Benchmark Results
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install pyyaml

      - name: Download benchmark results artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: tests/bench/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check for local benchmark results (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -f tests/bench/benchmark-results.json ]; then
            echo "No benchmark-results.json found — creating sample"
            echo '{"results":[]}' > tests/bench/benchmark-results.json
          fi

      - name: Generate leaderboard
        id: leaderboard
        run: |
          python scripts/update-leaderboard.py tests/bench/benchmark-results.json
          echo "badge_updated=true" >> $GITHUB_OUTPUT

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add comment to PR (if benchmark was from PR)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0]
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          body: |
            ## 📊 Benchmark Results Published
            
            Latest benchmark results have been published:
            - **Leaderboard**: ${{ steps.deployment.outputs.page_url }}leaderboard
            - **Report**: ${{ steps.deployment.outputs.page_url }}
            
            | Metric | Value |
            |--------|-------|
            | Run Timestamp | ${{ github.event.workflow_run.run_started_at }} |
            | Commit | ${{ github.event.workflow_run.head_sha }} |

      - name: Update README badge
        run: |
          if [ -f docs/badge.svg ]; then
            mkdir -p .github/badges
            cp docs/badge.svg .github/badges/benchmark.svg
            echo "README badge updated"
          fi

      - name: Commit badge to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update benchmark badge [skip ci]"
            git push
          fi
