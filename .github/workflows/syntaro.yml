name: SYNTARO

on:
  issues:
    types: [labeled]

env:
  NODE_VERSION: "22"

jobs:
  fix:
    name: Investigate & Fix
    if: github.event.label.name == 'syntaro:fix'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNTARO_BOT_APP_ID }}
          private-key: ${{ secrets.SYNTARO_BOT_PRIVATE_KEY }}

      - name: Post "working on it" comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const body = [
              '## 🔄 SYNTARO is on it',
              '',
              '**Issue:** ' + context.payload.issue.title,
              '',
              '| Step | Status |',
              '|------|--------|',
              '| 📥 Received | ✅ |',
              '| 🔍 Investigating | ⏳ |',
              '| ✏️ Writing fix | ⏳ |',
              '| 🧪 Verifying | ⏳ |',
              '| 📬 Creating PR | ⏳ |',
              '',
              'I\'ll investigate, fix, and open a draft PR. This takes a few minutes.',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run SYNTARO agent
        run: npx tsx scripts/syntaro-action.ts
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          OPENCODE_URL: ${{ secrets.OPENCODE_URL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: anthropic/claude-sonnet-4-20250514
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHEAP_MODEL: gpt-4o-mini
          CI: "true"
