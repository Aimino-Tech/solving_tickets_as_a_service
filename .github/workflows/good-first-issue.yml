name: Good First Issue

on:
  issues:
    types: [opened, labeled]

jobs:
  label:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'good first issue' || contains(github.event.issue.labels.*.name, 'good first issue')
    steps:
      - name: Add comment for good first issue
        if: github.event.label.name == 'good first issue'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                'This issue is marked as **good first issue** — a great place to start contributing to STAS!',
                '',
                'If you need help getting started:',
                '- Check [CONTRIBUTING.md](https://github.com/Aimino-Tech/solving_tickets_as_a_service/blob/main/CONTRIBUTING.md)',
                '- Join our [Discord](https://discord.gg/aimino)',
                '',
                'Happy hacking!',
              ].join('\n'),
            });
