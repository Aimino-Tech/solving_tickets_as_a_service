# =============================================================================
# SYNTARO CD Images — Build & Push ALL deployment images to GHCR
#
# The main cd.yml only builds the webhook image (ghcr.io/<repo>). The k8s
# deployment references FOUR images (see k8s/*.yaml). This workflow builds
# and pushes all of them so `kubectl apply -f k8s/` never ImagePullBackOffs.
#
# Images built:
#   - ghcr.io/aimino-tech/solving_tickets_as_a_service  (webhook, from repo root)
#   - ghcr.io/aimino-tech/syntaro-worker                (Celery worker, workers/Dockerfile)
#   - ghcr.io/aimino-tech/syntaro-dashboard             (React SPA, dashboard/)
#   - ghcr.io/aimino-tech/syntaro-mcp                   (MCP SSE server, Dockerfile.smithery)
#
# Tagged: latest + git SHA (e.g. syntaro-worker:latest, syntaro-worker:<sha>)
# =============================================================================

name: CD Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ghcr.io/aimino-tech

jobs:
  build-and-push-all:
    name: Build & Push all images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: syntaro-worker
            context: .
            dockerfile: workers/Dockerfile
          - name: syntaro-dashboard
            context: ./dashboard
            dockerfile: dashboard/Dockerfile
          - name: syntaro-mcp
            context: .
            dockerfile: Dockerfile.smithery

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_NS }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ Built and pushed \`${{ env.IMAGE_NS }}/${{ matrix.name }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
