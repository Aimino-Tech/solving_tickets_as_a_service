name: stas-quickstart-e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

env:
  NODE_VERSION: "22"

jobs:
  quickstart:
    name: Fresh install end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build stas-cli
        run: |
          cd packages/stas-cli
          npm run build

      - name: Run npx stas quickstart (headless)
        id: quickstart
        run: |
          set -o pipefail
          output=$(CI=true npx tsx packages/stas-cli/src/cli.ts quickstart --yes 2>&1)
          echo "$output"
          echo "$output" > /tmp/quickstart-output.txt
        env:
          GITHUB_TOKEN: ${{ secrets.STAS_QUICKSTART_TOKEN }}
          STAS_QUICKSTART_REPO: ${{ secrets.STAS_QUICKSTART_REPO }}

      - name: Verify config.json created with poweredBy
        run: |
          if [ ! -f "$HOME/.config/stas/config.json" ]; then
            echo "❌ ~/.config/stas/config.json was not created"
            exit 1
          fi
          cat "$HOME/.config/stas/config.json"
          grep -q '"poweredBy"' "$HOME/.config/stas/config.json"
          echo "✅ poweredBy field present in config.json"

      - name: Verify PR URL returned
        run: |
          if ! grep -qE 'https://github.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/pull/[0-9]+' /tmp/quickstart-output.txt; then
            echo "❌ No PR URL found in quickstart output"
            cat /tmp/quickstart-output.txt
            exit 1
          fi
          echo "✅ PR URL returned by quickstart"
