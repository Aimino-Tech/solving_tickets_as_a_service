# =============================================================================
# Secret Scanning — truffleHog + GitHub Secret Scanning
#
# Scans every push and PR for leaked credentials using:
#   1. truffleHog (deep git history + filesystem scan)
#   2. GitHub's secret scanning via CodeQL upload
#
# The pre-PR gate (src/agent/secretsScanGate.ts) also runs truffleHog locally
# during CI gates and blocks PRs on verified secrets.
#
# False positives are suppressed via .trufflehogignore at repo root.
# =============================================================================

name: Secret Scanning

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##############################################################################
  # TRUFFLEHOG SECRET SCAN
  # Scans the full git history for verified secrets.
  # Fails the build if any verified secret is found.
  ##############################################################################
  trufflehog:
    name: truffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Full history for deep scanning

      - name: truffleHog OSS
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --results=verified --fail --no-verification

  ##############################################################################
  # GITHUB SECRET SCANNING (via CodeQL upload)
  # Uploads results to GitHub's secret scanning alerts dashboard.
  # Note: GitHub's native secret scanning must also be enabled in repo settings.
  ##############################################################################
  ghas-secrets:
    name: GitHub Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python
          queries: security-and-quality

      - name: Auto build
        run: |
          if [ -f "package.json" ]; then
            npm ci 2>/dev/null || true
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript,/language:python"
          upload: true

  ##############################################################################
  # SUMMARY — results aggregation for PR comments
  ##############################################################################
  summary:
    name: Secret Scan Summary
    runs-on: ubuntu-latest
    needs: [trufflehog, ghas-secrets]
    if: always()
    steps:
      - name: Collect results
        run: |
          echo "## 🔐 Secret Scanning Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### truffleHog" >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.trufflehog.result }}' | \
            grep -q 'success' && echo '✅ No verified secrets found' || \
            echo '❌ Verified secrets detected — review alerts' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Secret Scanning (CodeQL)" >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.ghas-secrets.result }}' | \
            grep -q 'success' && echo '✅ Scan completed' || \
            echo '⚠️  Scan encountered issues' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "False positives? Update \`.trufflehogignore\` at repo root." >> $GITHUB_STEP_SUMMARY
