# =============================================================================
# STAS CI — Lint, TypeCheck, Test (with coverage), Build, and E2E
#
# Optimizations:
#   - Dependency caching via actions/setup-node (npm ci ~5s)
#   - Parallel independent jobs (lint, typecheck, test, build, e2e)
#   - Workflow concurrency: cancels in-progress runs on same branch
#   - E2E job with Docker Compose services (Redis)
#   - Coverage threshold (minimum 70%)
#   - workflow_dispatch trigger for manual runs
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_lint:
        description: "Skip lint job (true/false)"
        required: false
        default: "false"
      skip_e2e:
        description: "Skip E2E tests (true/false)"
        required: false
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CI: true

jobs:
  ##############################################################################
  # LINT — fast-fail gate: if lint fails, dependent jobs are skipped
  ##############################################################################
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skipped: ${{ steps.check-skip.outputs.skipped }}
    steps:
      - name: Check lint skip flag
        id: check-skip
        run: echo "skipped=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_lint == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check-skip.outputs.skipped != 'true'

      - uses: actions/setup-node@v4
        if: steps.check-skip.outputs.skipped != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: steps.check-skip.outputs.skipped != 'true'
        run: npm ci

      - name: Run Biome lint
        if: steps.check-skip.outputs.skipped != 'true'
        run: npm run lint:ci

  ##############################################################################
  # TYPE CHECK
  ##############################################################################
  typecheck:
    name: Type Check (tsc)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

  ##############################################################################
  # UNIT TESTS + COVERAGE (min 70% line coverage enforced)
  ##############################################################################
  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Enforce minimum 70% line coverage
        run: |
          COVERAGE=$(npx vitest run --coverage --reporter=json 2>/dev/null | \
            grep -o '"lines":{"total":[0-9]*,"covered":[0-9]*,"skipped":[0-9]*,"pct":[0-9.]*' | \
            grep -o '"pct":[0-9.]*' | grep -o '[0-9.]*' | head -1)
          if [ -z "$COVERAGE" ]; then
            echo "⚠️  Could not parse coverage — check vitest output"
            exit 1
          fi
          echo "📊 Line coverage: ${COVERAGE}%"
          MIN_COVERAGE=70
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below minimum ${MIN_COVERAGE}%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold of ${MIN_COVERAGE}%"

  ##############################################################################
  # BUILD
  ##############################################################################
  build:
    name: Build (tsc)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

  ##############################################################################
  # E2E TESTS — Docker Compose services (Redis, RabbitMQ)
  ##############################################################################
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_e2e != 'true' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Docker Compose services (Redis + RabbitMQ)
        run: |
          docker compose up -d redis rabbitmq
          echo "Waiting for Redis..."
          timeout 30s sh -c 'until docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done'
          echo "Redis is healthy"
          echo "Waiting for RabbitMQ..."
          timeout 30s sh -c 'until docker compose exec -T rabbitmq rabbitmq-diagnostics check_port_connectivity 2>/dev/null; do sleep 1; done'
          echo "RabbitMQ is healthy"

      - name: Run E2E tests
        run: npx vitest run --testNamePattern="e2e|E2E|integration" --reporter=verbose
        continue-on-error: true
        env:
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://stas-app:stas-app-password@localhost:5672/stas

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs --tail=50

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v
