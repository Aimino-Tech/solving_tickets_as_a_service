name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type Check (tsc)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e-test:
    name: E2E Test (Integration)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          TEST: "true"
          LOG_LEVEL: silent
          GITHUB_APP_ID: "999999"
          GITHUB_WEBHOOK_SECRET: test-secret
          DEV_SKIP_WEBHOOK_SIGNATURE_VERIFY: "true"
          STAS_LABEL: stas:fix
          ADMIN_API_KEY: test-admin-key
          IP_ALLOWLIST_ENABLED: "false"
          SLACK_WEBHOOK_URL: ""
          E2B_API_KEY: ""

  build:
    name: Build (tsc)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build

  audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run npm audit (fail on high/critical)
        run: npm audit --audit-level=high
        continue-on-error: false
