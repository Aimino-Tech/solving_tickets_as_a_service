# =============================================================================
# Update Leaderboard - commits latest benchmark data to the repo
#
# Triggered on:
#   - Successful completion of "Benchmarks (Daily)" workflow
#   - Manual workflow_dispatch
#
# Features:
#   - Downloads benchmark results artifact from the triggering workflow
#   - Generates leaderboard.json, leaderboard.md, and badge
#   - Commits & pushes updated leaderboard to the repo
#   - Deploys updated GitHub Pages site
# =============================================================================

name: Update Leaderboard

on:
  workflow_run:
    workflows: ["Benchmarks (Daily)"]
    types:
      - completed
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  update-leaderboard:
    name: Update Leaderboard Data
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Download benchmark results artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: tests/bench/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check for local benchmark results (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -f tests/bench/benchmark-results.json ]; then
            echo "No benchmark-results.json found"
            exit 1
          fi

      - name: Generate leaderboard data
        run: |
          python scripts/update-leaderboard.py tests/bench/benchmark-results.json

      - name: Generate comparison report and badges
        run: |
          python workers/benchmark/generate_report.py \
            --input tests/bench/benchmark-results.json \
            --output-dir docs/benchmarks \
            --badge-dir .github/badges

      - name: Commit leaderboard and badge updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/leaderboard.json docs/leaderboard.md docs/_data/leaderboard.yml \
                  docs/badge.svg docs/benchmarks/ .github/badges/ 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: update benchmark leaderboard [skip ci]"
            git push
            echo "Leaderboard updated and pushed"
          else
            echo "No changes to leaderboard"
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment URL
        run: |
          echo "Benchmark results published to GitHub Pages: ${{ steps.deployment.outputs.page_url }}"
