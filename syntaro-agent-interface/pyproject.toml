[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntaro-agent-interface"
version = "0.1.0"
description = "Unified Agent Interface Layer - MCP SDK + Discovery + Auth for SYNTARO"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Aimino", email = "dev@aimino.com" }]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12"]
keywords = ["syntaro", "mcp", "agent", "sdk", "github-bot"]
dependencies = ["mcp>=1.0.0", "fastapi>=0.100.0", "uvicorn[standard]>=0.20.0", "pydantic>=2.0.0", "httpx>=0.25.0", "pyjwt>=2.8.0", "cryptography>=41.0.0"]

[project.urls]
Homepage = "https://github.com/Aimino-Tech/solving_tickets_as_a_service"
Repository = "https://github.com/Aimino-Tech/solving_tickets_as_a_service"

[project.scripts]
syntaro-mcp = "syntaro_agent_interface.__main__:main"
syntaro-rest = "syntaro_agent_interface.rest_api:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["syntaro_agent_interface*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
