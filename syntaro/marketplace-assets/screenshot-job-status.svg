<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#1e1e2e"/>
  <!-- Dashboard panel -->
  <rect x="40" y="30" width="720" height="540" rx="12" fill="#2d2d44" stroke="#3d3d54" stroke-width="1"/>
  <!-- Header -->
  <text x="400" y="65" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="bold" fill="#ddd">SYNTARO Job Dashboard</text>
  <!-- Job status card -->
  <rect x="60" y="90" width="680" height="460" rx="10" fill="#252536"/>
  <text x="80" y="125" font-family="system-ui" font-size="16" font-weight="bold" fill="#ddd">Job: syntaro_job_abc123</text>
  <!-- Status badge -->
  <rect x="600" y="105" width="120" height="28" rx="14" fill="#53d769" opacity="0.2"/>
  <text x="660" y="124" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#53d769">COMPLETED</text>
  <!-- Details grid -->
  <text x="80" y="165" font-family="system-ui" font-size="13" fill="#888">Repository</text>
  <text x="80" y="185" font-family="monospace" font-size="13" fill="#ddd">https://github.com/owner/repo</text>
  <text x="80" y="220" font-family="system-ui" font-size="13" fill="#888">Issue</text>
  <text x="80" y="240" font-family="system-ui" font-size="13" fill="#ddd">Login endpoint returns 500 for special characters</text>
  <text x="80" y="275" font-family="system-ui" font-size="13" fill="#888">PR Created</text>
  <text x="80" y="295" font-family="system-ui" font-size="13" fill="#82b">https://github.com/owner/repo/pull/43</text>
  <text x="80" y="330" font-family="system-ui" font-size="13" fill="#888">Branch</text>
  <text x="80" y="350" font-family="monospace" font-size="13" fill="#ddd">syntaro-fix/login-validation-bug</text>
  <text x="80" y="385" font-family="system-ui" font-size="13" fill="#888">Summary</text>
  <text x="80" y="405" font-family="system-ui" font-size="13" fill="#ddd">Fixed input sanitization in login endpoint</text>
  <!-- Test results -->
  <text x="80" y="445" font-family="system-ui" font-size="13" fill="#888">Test Results</text>
  <rect x="80" y="460" width="60" height="40" rx="6" fill="#53d769" opacity="0.15"/>
  <text x="110" y="486" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="bold" fill="#53d769">15</text>
  <text x="80" y="510" font-family="system-ui" font-size="11" fill="#53d769">Passed</text>
  <rect x="155" y="460" width="60" height="40" rx="6" fill="#ff5f57" opacity="0.15"/>
  <text x="185" y="486" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="bold" fill="#ff5f57">0</text>
  <text x="155" y="510" font-family="system-ui" font-size="11" fill="#ff5f57">Failed</text>
  <rect x="230" y="460" width="60" height="40" rx="6" fill="#82b" opacity="0.15"/>
  <text x="260" y="486" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="bold" fill="#82b">2</text>
  <text x="230" y="510" font-family="system-ui" font-size="11" fill="#82b">New Tests</text>
</svg>
