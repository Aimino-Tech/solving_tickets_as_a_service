<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#1e1e2e"/>
  <!-- Dashboard panel -->
  <rect x="40" y="30" width="720" height="540" rx="12" fill="#2d2d44" stroke="#3d3d54" stroke-width="1"/>
  <text x="400" y="65" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="bold" fill="#ddd">SYNTARO Benchmark Eval Results</text>
  <!-- Overall pass rate card -->
  <rect x="280" y="90" width="240" height="100" rx="10" fill="#252536" stroke="#53d769" stroke-width="2"/>
  <text x="400" y="125" text-anchor="middle" font-family="system-ui" font-size="14" fill="#888">Overall Pass Rate</text>
  <text x="400" y="170" text-anchor="middle" font-family="system-ui" font-size="36" font-weight="bold" fill="#53d769">72.5%</text>
  <!-- Benchmark bars -->
  <text x="80" y="230" font-family="system-ui" font-size="14" font-weight="bold" fill="#ddd">Benchmark Results</text>
  <!-- SWE-bench Lite -->
  <text x="80" y="265" font-family="system-ui" font-size="13" fill="#888">SWE-bench Lite</text>
  <rect x="80" y="275" width="640" height="20" rx="4" fill="#333"/>
  <rect x="80" y="275" width="437" height="20" rx="4" fill="#53d769" opacity="0.8"/>
  <text x="660" y="290" text-anchor="end" font-family="system-ui" font-size="12" font-weight="bold" fill="#53d769">68.3%</text>
  <!-- HumanEval -->
  <text x="80" y="320" font-family="system-ui" font-size="13" fill="#888">HumanEval</text>
  <rect x="80" y="330" width="640" height="20" rx="4" fill="#333"/>
  <rect x="80" y="330" width="518" height="20" rx="4" fill="#82b" opacity="0.8"/>
  <text x="660" y="345" text-anchor="end" font-family="system-ui" font-size="12" font-weight="bold" fill="#82b">81.0%</text>
  <!-- XOR Benchmark -->
  <text x="80" y="375" font-family="system-ui" font-size="13" fill="#888">XOR Benchmark</text>
  <rect x="80" y="385" width="640" height="20" rx="4" fill="#333"/>
  <rect x="80" y="385" width="454" height="20" rx="4" fill="#e9a" opacity="0.8"/>
  <text x="660" y="400" text-anchor="end" font-family="system-ui" font-size="12" font-weight="bold" fill="#e9a">70.9%</text>
  <!-- Bug Fix Benchmark -->
  <text x="80" y="430" font-family="system-ui" font-size="13" fill="#888">Bug Fix Benchmark</text>
  <rect x="80" y="440" width="640" height="20" rx="4" fill="#333"/>
  <rect x="80" y="440" width="480" height="20" rx="4" fill="#f9a" opacity="0.8"/>
  <text x="660" y="455" text-anchor="end" font-family="system-ui" font-size="12" font-weight="bold" fill="#f9a">75.0%</text>
  <!-- Legend -->
  <text x="80" y="510" font-family="system-ui" font-size="13" fill="#888">Last updated: June 24, 2026</text>
  <text x="80" y="530" font-family="system-ui" font-size="13" fill="#888">Benchmarks: 40 total</text>
</svg>
