# SYNTARO Egress Proxy — Squid Configuration
#
# Domain allowlist proxy. Only the domains listed in the
# ALLOWED_DOMAINS environment variable are permitted.
# All other outbound traffic is denied.
#
# The ALLOWED_DOMAINS placeholder is replaced at container
# start by the entrypoint script.

http_port 3128

# Deny all by default
http_access deny all

# Allow only whitelisted domains
acl allowed_domains dstdomain "/etc/squid/allowed_domains.txt"
http_access allow allowed_domains

# Allow localhost access (for management)
acl localnet src 127.0.0.0/8
http_access allow localnet

# Coredump dir
coredump_dir /var/spool/squid

# Performance tuning
cache_mem 64 MB
maximum_object_size_in_memory 512 KB
memory_replacement_policy heap GDSF

# Don't cache anything (sandbox sessions are ephemeral)
cache deny all

# No ICP, no HTCP
icp_port 0
htcp_port 0

# Logging
access_log daemon:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
logfile_rotate 4

# Forward proxy only (no reverse proxy)
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Safety: block all other ports
acl Safe_ports port 80 443 3128
acl SSL_ports port 443
