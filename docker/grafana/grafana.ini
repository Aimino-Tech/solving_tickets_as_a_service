# ──────────────────────────────────────────────────────────────────────────────
# Grafana Configuration — Marketing ROI Dashboard
# ──────────────────────────────────────────────────────────────────────────────
# This file is mounted at /etc/grafana/grafana.ini inside the container.
# Settings here override the default grafana.ini shipped with the image.
#
# Convention: set STATIC config here (paths, server, auth), DYNAMIC config
# (admin credentials, feature flags, plugin overrides) via environment
# variables in docker-compose.grafana.yml so they can be changed without
# rebuilding.
# ──────────────────────────────────────────────────────────────────────────────

[server]
# Port — default is 3000, overridable via GF_SERVER_HTTP_PORT env
http_port = 3000

# Enforce localhost-only access (add a reverse proxy for remote access)
# docker-compose.grafana.yml can override this for production deployments
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/

# Security headers
enable_gzip = true
enforce_domain = false
router_logging = false
static_root_path = public
protocol = http

[security]
# Admin credentials are set via GF_SECURITY_ADMIN_USER / _PASSWORD env vars
admin_user = admin
admin_password = hermes

# Disable anonymous access for a marketing dashboard
anonymous_enabled = false

# Strict transport security (only if serving over HTTPS)
strict_transport_security = false

# Allow embedding in iframes (so dashboards can be embedded in other UIs)
allow_embedding = true

# Cookie settings
cookie_secure = false
cookie_samesite = lax

[database]
# Use embedded SQLite for Grafana's own metadata
# Separate from the marketing campaigns.db
type = sqlite3
path = grafana.db
cache_mode = private

[paths]
# Data directory for Grafana's internal state
data = /var/lib/grafana

# Logs
logs = /var/log/grafana

# Plugins
plugins = /var/lib/grafana/plugins

# Provisioning config
provisioning = /etc/grafana/provisioning

# Custom dashboards (mounted from host, read-only)
dashboards = /var/lib/grafana/dashboards

[analytics]
# Disable phone-home telemetry
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console
level = info
filters = provisioning:debug

[metrics]
# Enable basic metrics for container monitoring
enabled = true
interval_seconds = 60

[plugins]
# Allow unsigned plugins (needed for community DuckDB datasource)
allow_loading_unsigned_plugins = grafana-duckdb-datasource

[alerting]
enabled = false
execute_alerts = false

[unified_alerting]
enabled = false

[explore]
enabled = true

[panels]
disable_sanitize_html = false

[feature_toggles]
# Enable features used by pre-built dashboards
enable = transformations variableOptions
