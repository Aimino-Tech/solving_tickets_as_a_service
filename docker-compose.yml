services:

  redis:
    image: redis:7-alpine
    container_name: stas-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

    # ── Security Constraints ──────────────────────────────────────────
    # Run with least privilege: read-only root FS, no new privileges,
    # dropped capabilities, resource limits
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    pids_limit: 256
    # ──────────────────────────────────────────────────────────────────
    networks:
      - stas-net
    # Note: Sandbox containers should run on an isolated network
    # without access to the stas-net internal network

  rabbitmq:
    build:
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
    container_name: stas-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "5671:5671"
    environment:
      - RAPIDAPI_PROXY_SECRET=${RAPIDAPI_PROXY_SECRET:-}
      - RAPIDAPI_PROVIDER_KEY=${RAPIDAPI_PROVIDER_KEY:-}
      RABBITMQ_DEFAULT_USER: stas-app
      RABBITMQ_DEFAULT_PASS: stas-app-password
      RABBITMQ_DEFAULT_VHOST: /stas
      STAS_MONITOR_PASSWORD: stas-monitor-password
      STAS_DEV_VHOST: /stas-dev
      STAS_APP_USER: stas-app
      STAS_MONITOR_USER: stas-monitor
      STAS_VHOST: /stas
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stas-net

  bot:
    build: .
    container_name: stas-bot
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - RAPIDAPI_PROXY_SECRET=${RAPIDAPI_PROXY_SECRET:-}
      - RAPIDAPI_PROVIDER_KEY=${RAPIDAPI_PROVIDER_KEY:-}
      - REDIS_URL=redis://stas-redis:6379
      - RABBITMQ_URL=amqp://stas-app:stas-app-password@stas-rabbitmq:5672/stas
      - OPENCODE_URL=http://opencode:4096
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
    networks:
      - stas-net
    restart: unless-stopped

  workers-celery:
    build: ./workers
    container_name: stas-workers-celery
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - RAPIDAPI_PROXY_SECRET=${RAPIDAPI_PROXY_SECRET:-}
      - RAPIDAPI_PROVIDER_KEY=${RAPIDAPI_PROVIDER_KEY:-}
      - CELERY_BROKER_URL=pyamqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - OPENCODE_URL=http://opencode:4096
    networks:
      - stas-net
    restart: unless-stopped

  celery-beat:
    build: ./workers
    container_name: stas-celery-beat
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - RAPIDAPI_PROXY_SECRET=${RAPIDAPI_PROXY_SECRET:-}
      - RAPIDAPI_PROVIDER_KEY=${RAPIDAPI_PROVIDER_KEY:-}
      - CELERY_BROKER_URL=pyamqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    command: ["celery", "-A", "celery_app", "beat", "--loglevel=info"]
    networks:
      - stas-net
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    container_name: stas-flower
    ports:
      - "5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RAPIDAPI_PROXY_SECRET=${RAPIDAPI_PROXY_SECRET:-}
      - RAPIDAPI_PROVIDER_KEY=${RAPIDAPI_PROVIDER_KEY:-}
      - CELERY_BROKER_URL=pyamqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: ["celery", "--broker=pyamqp://guest:guest@rabbitmq:5672//", "flower", "--port=5555"]
    networks:
      - stas-net
    restart: unless-stopped

  # ── Egress Proxy ──────────────────────────────────────────────────
  stas-egress-proxy:
    build:
      context: ./docker/squid
      dockerfile: Dockerfile
    image: stas-egress-proxy:latest
    container_name: stas-egress-proxy
    ports:
      - "3128:3128"
    environment:
      ALLOWED_DOMAINS: ${DOCKER_ALLOWED_HOSTS:-api.github.com,github.com,raw.githubusercontent.com,registry.npmjs.org,pypi.org,files.pythonhosted.org,proxy.golang.org,index.crates.io,crates.io}
    networks:
      - stas-net
      - stas_agent-net
    restart: unless-stopped

volumes:
  redis-data:
  rabbitmq-data:

networks:
  stas-net:
    driver: bridge
  stas_agent-net:
    driver: bridge
    internal: false
    name: stas_agent-net
