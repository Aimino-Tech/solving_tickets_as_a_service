services:

  # ── In-Memory Data Store ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stas-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    pids_limit: 256
    networks:
      - stas-net

  # ── Message Broker ────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: stas-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stas-net

  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stas-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stas
      POSTGRES_PASSWORD: stas
      POSTGRES_DB: stas
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stas"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - stas-net

  # ── Express Bot (existing) ────────────────────────────────────────────
  bot:
    build: .
    container_name: stas-bot
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://stas-redis:6379
      - DATABASE_URL=postgres://stas:stas@stas-postgres:5432/stas
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
    networks:
      - stas-net
    restart: unless-stopped

  # ── Django Web App ────────────────────────────────────────────────────
  django:
    build:
      context: .
      dockerfile: stas_project/Dockerfile
    container_name: stas-django
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@stas-rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://stas-redis:6379/0
      - DATABASE_URL=postgres://stas:stas@stas-postgres:5432/stas
      - DJANGO_DEBUG=true
    volumes:
      - ./stas_project:/app/stas_project
      - ./workers:/app/workers
    networks:
      - stas-net
    restart: unless-stopped

  # ── Celery Worker ─────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: stas-worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@stas-rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://stas-redis:6379/0
      - DATABASE_URL=postgres://stas:stas@stas-postgres:5432/stas
      - DJANGO_SETTINGS_MODULE=stas.settings
    volumes:
      - ./stas_project:/app/stas_project
      - ./workers:/app/workers
    networks:
      - stas-net
    restart: unless-stopped

  # ── Flower (Celery Monitor) ────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: stas-flower
    ports:
      - "5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@stas-rabbitmq:5672//
      - FLOWER_PORT=5555
    networks:
      - stas-net
    restart: unless-stopped

volumes:
  redis-data:
  rabbitmq-data:
  postgres-data:

networks:
  stas-net:
    driver: bridge
