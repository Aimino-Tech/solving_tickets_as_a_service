# ---------------------------------------------------------------------------
# SYNTARO Webhook Service — exposes the webhook API internally
# Nginx or Ingress handles external TLS termination and load balancing.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: syntaro-webhook
  namespace: syntaro
  labels:
    app: syntaro-webhook
    tier: webhook
spec:
  selector:
    app: syntaro-webhook
  ports:
    - port: 80
      targetPort: 3000
      name: http
      protocol: TCP
  type: ClusterIP
