# ---------------------------------------------------------------------------
# SYNTARO Dashboard — React/Vite static site served by nginx
#
# Built from dashboard/Dockerfile (nginx serving the Vite build output).
# The dashboard calls the API through the Vite proxy; in production it
# talks to the webhook Service at /api via the Ingress same-origin path.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syntaro-dashboard
  namespace: syntaro
  labels:
    app: syntaro-dashboard
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: syntaro-dashboard
  template:
    metadata:
      labels:
        app: syntaro-dashboard
        tier: frontend
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/aimino-tech/syntaro-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: syntaro-dashboard
  namespace: syntaro
  labels:
    app: syntaro-dashboard
spec:
  selector:
    app: syntaro-dashboard
  ports:
    - port: 80
      targetPort: 80
      name: http
