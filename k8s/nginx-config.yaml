# ---------------------------------------------------------------------------
# SYNTARO Nginx config — referenced by nginx-deployment.yaml as
# `syntaro-nginx-config`. Reverse-proxies to the webhook and dashboard
# services. This is only needed if you use the standalone nginx Deployment
# (k8s/nginx-deployment.yaml) instead of an Ingress controller; if you use
# the Ingress (k8s/ingress.yaml), this ConfigMap is unused.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: syntaro-nginx-config
  namespace: syntaro
  labels:
    app: syntaro-nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
      access_log /var/log/nginx/access.log main;

      sendfile on;
      keepalive_timeout 65;

      # API / webhook upstream
      upstream syntaro_webhook {
        server syntaro-webhook:80;
      }

      # Dashboard upstream
      upstream syntaro_dashboard {
        server syntaro-dashboard:80;
      }

      server {
        listen 80;
        server_name _;

        location / {
          proxy_pass http://syntaro_webhook;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 300s;
        }
      }
    }
