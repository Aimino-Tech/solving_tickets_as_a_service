apiVersion: apps/v1
kind: Deployment
metadata:
  name: syntaro-nginx
  labels:
    app: syntaro-nginx
    tier: ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: syntaro-nginx
  template:
    metadata:
      labels:
        app: syntaro-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-ssl
              mountPath: /etc/nginx/ssl
              readOnly: true
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: syntaro-nginx-config
        - name: nginx-ssl
          secret:
            secretName: syntaro-tls
---
apiVersion: v1
kind: Service
metadata:
  name: syntaro-nginx
  labels:
    app: syntaro-nginx
spec:
  selector:
    app: syntaro-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: syntaro-nginx
  labels:
    app: syntaro-nginx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: syntaro-nginx
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
