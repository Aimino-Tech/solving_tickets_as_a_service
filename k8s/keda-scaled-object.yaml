# ---------------------------------------------------------------------------
# STAS KEDA ScaledObject — RabbitMQ queue-depth-driven worker auto-scaling
#
# Scales the stas-worker Deployment from 0 (idle, no messages) to 20
# replicas based on Celery queue backlog.  Scale-up is fast (zero-second
# stabilization window); scale-down is gradual (60s cooldown) to avoid
# flapping during brief lulls.
#
# Each Celery queue has its own threshold — critical queues (dispatch)
# scale at just 2 messages; high-volume queues (notifications) wait for
# 10+.  The aggregate of all queue triggers determines the target replica
# count.
#
# An external Prometheus metrics endpoint (served by the Python worker at
# :9091/keda-metrics) is also registered so KEDA can fall back to
# Prometheus-scraped queue depth when direct RabbitMQ queries are
# unavailable (e.g. RMQ management plugin disabled).
#
# Prerequisites
# -------------
# 1. KEDA v2.12+ installed in the cluster.
# 2. RabbitMQ Management Plugin enabled (for direct queue-depth queries).
# 3. Kubernetes Secret ``stas-secrets`` with key
#    ``RABBITMQ_KEDA_CONNECTION`` — the AMQP URI, e.g.:
#      amqp://user:password@stas-rabbitmq:5672/stas
# 4. (optional) Prometheus operator / kube-prometheus-stack for the
#    Prometheus scaler fallback.
#
# Install:
#   kubectl apply -f k8s/keda-scaled-object.yaml
#
# Verify:
#   kubectl get scaledobject stas-worker
#   kubectl get hpa                     # KEDA creates an HPA automatically
#   kubectl describe scaledobject stas-worker  # events + trigger status
# ---------------------------------------------------------------------------
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: stas-rabbitmq-auth
  labels:
    app: stas-worker
    tier: worker
spec:
  secretTargetRef:
    - parameter: host
      name: stas-secrets
      key: RABBITMQ_KEDA_CONNECTION
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: stas-worker
  labels:
    app: stas-worker
    tier: worker
    component: queue-processor
  annotations:
    # ── Autoscaling behaviour hints for operators ──────────────────────
    scaling.keda.sh/minReplicaCount: "0"
    scaling.keda.sh/maxReplicaCount: "20"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stas-worker
  # ── Scaling boundaries ──────────────────────────────────────────────
  # minReplicaCount=0 enables true zero-to-N: when all queues are idle
  # KEDA scales the Deployment down to 0 and scales back up on the first
  # message.  The cooldown period prevents rapid scale-in/scale-out.
  minReplicaCount: 0
  maxReplicaCount: 20
  pollingInterval: 15          # seconds — how often KEDA checks queue depth
  cooldownPeriod: 120          # seconds — wait before scaling *down*
  # ── Advanced HPA behaviour ──────────────────────────────────────────
  # These policies override the KEDA default HPA behaviour to give fast
  # scale-up (100% additional capacity per 30s) and gentle scale-down
  # (50% reduction per 60s, with a 60s stabilization window).
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
  # ── Triggers ────────────────────────────────────────────────────────
  # Each trigger maps to a Celery queue.  KEDA averages the metric values
  # across all triggers; the most-loaded queue drives the replica target.
  #
  # Queue              Threshold   Rationale
  # ─────────────────────────────────────────────────────────────
  # triage              5          Short classification tasks
  # dispatch            2          High-priority agent execution
  # sandbox             3          Long-running, resource-heavy
  # verification        3          Moderate duration
  # pr_creation         5          Batchable, fast
  # notifications      10          High volume, fast
  # default (catchall)  5          Unknown / fallback tasks
  triggers:
    # ── RabbitMQ direct scaler (primary) ────────────────────────────
    # Uses the RabbitMQ Management HTTP API to query queue depth.
    # Requires the management plugin to be enabled on the broker.
    - type: rabbitmq
      metadata:
        protocol: amqp0-9-1
        queueName: stas.agents.dlq
        mode: QueueLength
        value: "1"
      authenticationRef:
        name: stas-rabbitmq-auth
    - type: rabbitmq
      metadata:
        protocol: amqp0-9-1
        queueName: stas.agents.triage
        mode: QueueLength
        value: "5"
      authenticationRef:
        name: stas-rabbitmq-auth
    - type: rabbitmq
      metadata:
        protocol: amqp0-9-1
        queueName: stas.agents.dispatch
        mode: QueueLength
        value: "2"
      authenticationRef:
        name: stas-rabbitmq-auth
    - type: rabbitmq
      metadata:
        protocol: amqp0-9-1
        queueName: stas.agents.sandbox
        mode: QueueLength
        value: "3"
      authenticationRef:
        name: stas-rabbitmq-auth
    - type: rabbitmq
      metadata:
        protocol: amqp0-9-1
        queueName: stas.agents.verification
        mode: QueueLength
        value: "3"
      authenticationRef:
        name: stas-rabbitmq-auth
    - type: rabbitmq
      metadata:
        protocol: amqp0-9-1
        queueName: stas.agents.pr_creation
        mode: QueueLength
        value: "5"
      authenticationRef:
        name: stas-rabbitmq-auth
    - type: rabbitmq
      metadata:
        protocol: amqp0-9-1
        queueName: stas.agents.notifications
        mode: QueueLength
        value: "10"
      authenticationRef:
        name: stas-rabbitmq-auth
    - type: rabbitmq
      metadata:
        protocol: amqp0-9-1
        queueName: stas.agents.default
        mode: QueueLength
        value: "5"
      authenticationRef:
        name: stas-rabbitmq-auth
    # ── Prometheus scaler (fallback / supplementary) ─────────────────
    # KEDA can optionally scrape the worker's /keda-metrics endpoint
    # instead of (or in addition to) querying RabbitMQ directly.
    # Enable this by uncommenting and configuring the Prometheus server
    # address.
    #
    # The worker exposes queue depth as "keda_queue_depth" gauge labels
    # on port 9091 (configurable via KEDA_METRICS_PORT env var).
    #
    # - type: prometheus
    #   metadata:
    #     serverAddress: http://stas-worker-metrics:9091
    #     metricName: keda_queue_depth
    #     query: keda_queue_depth{queue="stas.agents.dispatch"}
    #     threshold: "2"
    #     namespace: stas
    #
    # - type: prometheus
    #   metadata:
    #     serverAddress: http://stas-worker-metrics:9091
    #     metricName: keda_queue_depth_sandbox
    #     query: keda_queue_depth{queue="stas.agents.sandbox"}
    #     threshold: "3"
    #     namespace: stas
