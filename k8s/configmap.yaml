# ---------------------------------------------------------------------------
# SYNTARO ConfigMap — shared (non-sensitive) environment variables.
# Sensitive values (keys, tokens, passwords) MUST be in a Secret, not here.
#
# NOTE: connection URLs (REDIS_URL / RABBITMQ_URL / DATABASE_URL /
# OPENCODE_URL) live in the syntaro-secrets Secret because they embed
# credentials. This ConfigMap carries everything else.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: syntaro-config
  namespace: syntaro
  labels:
    app: syntaro
data:
  # Runtime
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  RUN_MODE: "both"
  PORT: "3000"

  # Service hostnames (credentials come from Secret syntaro-secrets)
  OPENCODE_URL: "http://syntaro-opencode:4096"
  SYNTARO_MCP_SERVER_URL: "http://syntaro-mcp:4095"

  # SYNTARO behavior
  SYNTARO_LABEL: "syntaro:fix"
  SYNTARO_RATE_LIMIT_WINDOW_MS: "60000"
  SYNTARO_RATE_LIMIT_MAX: "30"
  SYNTARO_RATE_LIMIT_PER_REPO_MAX: "20"
  SYNTARO_RATE_LIMIT_PER_IP_MAX: "60"

  # Queue configuration
  QUEUE_BACKEND: "amqp"
  QUEUE_DEDUP_TTL_SECONDS: "120"
  QUEUE_MAX_RETRIES: "4"
  WORKER_CONCURRENCY: "4"

  # RabbitMQ tuning
  RABBITMQ_PREFETCH_COUNT: "10"
  RABBITMQ_RECONNECT_DELAY_MS: "5000"
  RABBITMQ_MAX_RECONNECT_ATTEMPTS: "10"

  # Database connection pool
  DATABASE_POOL_MIN: "2"
  DATABASE_POOL_MAX: "10"
  DATABASE_SSL: "false"

  # OpenCode model
  OPENCODE_MODEL: "anthropic/claude-sonnet-4-20250514"

  # MCP server (separate Deployment, no autostart inside webhook)
  SYNTARO_MCP_AUTO_START: "false"
