apiVersion: apps/v1
kind: Deployment
metadata:
  name: syntaro-bot
  labels:
    app: syntaro-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: syntaro-bot
  template:
    metadata:
      labels:
        app: syntaro-bot
    spec:
      containers:
        - name: syntaro-bot
          image: ghcr.io/tamnguyen08/solving_tickets_as_a_service:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: syntaro-env
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: syntaro-bot
spec:
  selector:
    app: syntaro-bot
  ports:
    - port: 3000
      targetPort: 3000
