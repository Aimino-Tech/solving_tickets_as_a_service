# ---------------------------------------------------------------------------
# SYNTARO Webhook Deployment — Express API server (horizontally scalable)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syntaro-webhook
  labels:
    app: syntaro-webhook
    tier: webhook
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: syntaro-webhook
  template:
    metadata:
      labels:
        app: syntaro-webhook
        tier: webhook
        component: api
    spec:
      containers:
        - name: webhook
          image: ghcr.io/tamnguyen08/solving_tickets_as_a_service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: syntaro-config
            - secretRef:
                name: syntaro-secrets
          env:
            - name: RUN_MODE
              value: "api"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
