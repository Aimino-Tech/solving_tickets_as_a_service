# ---------------------------------------------------------------------------
# STAS Worker Deployment — Celery worker (horizontally scalable per queue)
#
# Note: This deployment uses the Python Celery worker image built from
# workers/Dockerfile. Build and push it separately:
#   docker build -t ghcr.io/tamnguyen08/stas-worker:latest ./workers
#   docker push ghcr.io/tamnguyen08/stas-worker:latest
#
# Probes use exec (not HTTP) because the Celery worker process does not
# serve HTTP natively. The health.py script checks broker and backend
# connectivity and exits 0 on success.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stas-worker
  labels:
    app: stas-worker
    tier: worker
    component: queue-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stas-worker
  template:
    metadata:
      labels:
        app: stas-worker
        tier: worker
        component: queue-processor
    spec:
      containers:
        - name: worker
          image: ghcr.io/tamnguyen08/stas-worker:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - celery_app
            - worker
            - -l
            - info
            - -Q
            - stas.agents.triage,stas.agents.dispatch,stas.agents.sandbox,stas.agents.verification,stas.agents.pr_creation,stas.agents.notifications
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: stas-config
            - secretRef:
                name: stas-secrets
          env:
            - name: RUN_MODE
              value: "worker"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            exec:
              command: ["python3", "/app/health.py", "--check"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["python3", "/app/health.py", "--check"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
