# ---------------------------------------------------------------------------
# SYNTARO Worker Deployment — Celery worker (horizontally scalable per queue)
#
# Note: This deployment uses the Python Celery worker image built from
# workers/Dockerfile. Build and push it separately:
#   docker build -t ghcr.io/tamnguyen08/syntaro-worker:latest ./workers
#   docker push ghcr.io/tamnguyen08/syntaro-worker:latest
#
# Probes use exec (not HTTP) because the Celery worker process does not
# serve HTTP natively. The health.py script checks broker and backend
# connectivity and exits 0 on success.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syntaro-worker
  labels:
    app: syntaro-worker
    tier: worker
    component: queue-processor
spec:
  # terminationGracePeriodSeconds must exceed the longest task grace
  # period (300s for agent/sandbox) + preStop sleep (10s) + buffer.
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: syntaro-worker
  template:
    metadata:
      labels:
        app: syntaro-worker
        tier: worker
        component: queue-processor
    spec:
      terminationGracePeriodSeconds: 360
      containers:
        - name: worker
          image: ghcr.io/tamnguyen08/syntaro-worker:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - celery_app
            - worker
            - -l
            - info
            - -Q
            - syntaro.agents.triage,syntaro.agents.dispatch,syntaro.agents.sandbox,syntaro.agents.verification,syntaro.agents.pr_creation,syntaro.agents.notifications
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: syntaro-config
            - secretRef:
                name: syntaro-secrets
          env:
            - name: RUN_MODE
              value: "worker"
            - name: NODE_ENV
              value: "production"
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    sleep 5
                    # Kubernetes sends SIGTERM after preStop.
                    # GracefulShutdownHandler intercepts and drains tasks.
          livenessProbe:
            exec:
              command: ["python3", "/app/health.py", "--check"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["python3", "/app/health.py", "--check"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
