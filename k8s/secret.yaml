# ---------------------------------------------------------------------------
# SYNTARO Secrets — REQUIRED values. This file is a TEMPLATE.
#
# WARNING: Replace every placeholder below before applying. Do not commit
# real credentials. The deployment manifests reference this Secret as
# `syntaro-secrets` via `secretRef`. The values shown are the deployed
# service credentials (PostgreSQL / Redis / RabbitMQ) and dummy placeholders
# for GitHub/JWT that MUST be replaced with real values.
#
# Create with real values:
#   kubectl -n syntaro create secret generic syntaro-secrets \
#     --from-literal=GITHUB_APP_ID=... \
#     --from-literal=GITHUB_APP_PRIVATE_KEY="$(cat stas.private-key.pem)" \
#     --from-literal=GITHUB_WEBHOOK_SECRET=... \
#     --from-literal=JWT_SECRET=... \
#     --from-literal=ENCRYPTION_SECRET=... \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=REDIS_URL=... \
#     --from-literal=RABBITMQ_URL=... \
#     --from-literal=RABBITMQ_KEDA_CONNECTION=...
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: syntaro-secrets
  namespace: syntaro
  labels:
    app: syntaro
type: Opaque
stringData:
  # --- GitHub App (REQUIRED, real values) ---
  GITHUB_APP_ID: "REPLACE_ME"
  GITHUB_APP_PRIVATE_KEY: "REPLACE_ME_PEM_CONTENT"
  GITHUB_WEBHOOK_SECRET: "REPLACE_ME"

  # --- Auth (REQUIRED, >=32 chars each) ---
  JWT_SECRET: "REPLACE_ME_LONG_RANDOM_STRING"
  ENCRYPTION_SECRET: "REPLACE_ME_LONG_RANDOM_STRING"

  # --- LLM provider (pick at least one) ---
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  OPENAI_BASE_URL: "http://litellm-proxy:4002/v1"

  # --- Datastore connection URLs (in-cluster service hostnames) ---
  # If you use external managed services (e.g. behind Cloudflare Tunnel TCP
  # routes), replace the host:port with the forwarder addresses.
  DATABASE_URL: "postgresql://syntaro:CHANGE_ME_DB_PASSWORD@syntaro-postgres:5432/syntaro"
  REDIS_URL: "redis://:CHANGE_ME_REDIS_PASSWORD@syntaro-redis:6379"
  RABBITMQ_URL: "amqp://syntaro:CHANGE_ME_RMQ_PASSWORD@syntaro-rabbitmq:5672/syntaro"

  # --- Per-service passwords (must match the values embedded in the URLs
  # above; consumed by the postgres/redis/rabbitmq stateful deployments) ---
  POSTGRES_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  RABBITMQ_PASSWORD: "CHANGE_ME_RMQ_PASSWORD"

  # --- Grafana admin ---
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME_GRAFANA_PASSWORD"

  # --- KEDA RabbitMQ connection (must match RABBITMQ_URL) ---
  RABBITMQ_KEDA_CONNECTION: "amqp://syntaro:CHANGE_ME_RMQ_PASSWORD@syntaro-rabbitmq:5672/syntaro"

  # --- Sentry (optional) ---
  SENTRY_DSN: ""
---
# TLS certificate Secret — provisioned by cert-manager via the Ingress.
# Do not create manually; cert-manager fills it after `kubectl apply`.
# (Left here as a documented placeholder for manual certs if cert-manager
# is not used.)
apiVersion: v1
kind: Secret
metadata:
  name: syntaro-tls
  namespace: syntaro
  labels:
    app: syntaro
type: kubernetes.io/tls
