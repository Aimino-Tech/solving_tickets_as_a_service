# SSH config for remote OpenClaw gateway access
# Add to ~/.ssh/config on your laptop/client machine
#
# Usage: ssh -N openclaw-remote &
# Then open http://127.0.0.1:18789/ for dashboard
#            http://127.0.0.1:6080/  for noVNC browser view
#            http://127.0.0.1:8642/docs for DuckDB API

Host openclaw-remote
    HostName YOUR_SERVER_IP
    User YOUR_USER
    IdentityFile ~/.ssh/id_ed25519
    # Gateway WebSocket + Dashboard
    LocalForward 18789 127.0.0.1:18789
    # noVNC browser view
    LocalForward 6080 127.0.0.1:6080
    # DuckDB API
    LocalForward 8642 127.0.0.1:8642
    ServerAliveInterval 60
    ServerAliveCountMax 3
