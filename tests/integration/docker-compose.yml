version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stas_test
      POSTGRES_USER: stas
      POSTGRES_PASSWORD: stas_test_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stas -d stas_test"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      retries: 10

  stas:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.stas
    ports:
      - "4095:4095"
    environment:
      NODE_ENV: test
      PORT: 4095
      DATABASE_URL: postgres://stas:stas_test_pass@postgres:5432/stas_test
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PROXY_DISPATCH_URL: http://governance:4002
      GITHUB_APP_ID: test-app-id
      GITHUB_PRIVATE_KEY: test-key
      WEBHOOK_SECRET: test-secret
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      governance: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4095/health"]
      interval: 10s
      retries: 15

  governance:
    image: ghcr.io/aimino-tech/llm-governance:latest
    ports:
      - "4003:4002"
    environment:
      PROXY_CONFIG: /app/proxy_config.yaml
      AUDIT_LOG_DATABASE_URL: postgres://stas:stas_test_pass@postgres:5432/stas_test
      RATE_LIMIT_ENABLED: "true"
      KILL_SWITCH_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/guardrail/health"]
      interval: 10s
      retries: 15
