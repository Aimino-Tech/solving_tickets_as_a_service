version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syntaro_test
      POSTGRES_USER: syntaro
      POSTGRES_PASSWORD: syntaro_test_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntaro -d syntaro_test"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      retries: 10

  syntaro:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.syntaro
    ports:
      - "4095:4095"
    environment:
      NODE_ENV: test
      PORT: 4095
      # GITHUB_WEBHOOK_SECRET is required by src/config.ts; the old WEBHOOK_SECRET name is ignored.
      GITHUB_WEBHOOK_SECRET: test-secret
      GITHUB_APP_ID: test-app-id
      # src/config.ts reads SUPABASE_DATABASE_URL (DATABASE_URL alone is ignored).
      SUPABASE_DATABASE_URL: postgres://syntaro:syntaro_test_pass@postgres:5432/syntaro_test
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PROXY_DISPATCH_URL: http://governance:4002
      GITHUB_PRIVATE_KEY: test-key
      # Default is 120s polling opencode health at boot; keep the stack fast.
      OPENCODE_HEALTH_STARTUP_TIMEOUT_MS: "5000"
      # No real opencode server runs in the integration stack. Static mode makes
      # opencodeHealth report "healthy" so SYNTARO /health returns 200 and the compose
      # healthcheck (and the integration test beforeAll) can pass.
      SYNTARO_AI_MODE: static
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      governance: { condition: service_healthy }
    # NOTE: SYNTARO deliberately does NOT depend on opensymphony. OpenSymphony is an
    # optional upstream of the governance proxy; a broken/unavailable OS build must
    # never take the SYNTARO webhook path down. The integration tests probe OS health
    # and skip the full-path assertion when it is unavailable.
    # node:22-alpine has no curl — healthcheck must use node fetch.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4095/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      retries: 15

  # Built from source: the ghcr.io/aimino-tech/llm-governance image is private and there is
  # no publish workflow, so it cannot be pulled in public CI or by unauthenticated users.
  # Context is ../../llm-governance relative to tests/integration/ — a sibling checkout of
  # the llm-governance repo (CI checks it out at the workspace root).
  governance:
    build:
      context: ../../llm-governance
      dockerfile: Dockerfile
    ports:
      - "4003:4002"
    environment:
      # Required by governance entrypoint.sh (envsubst template) — any non-empty value works.
      OPENCODE_API_KEY: test-key
      # Required by guardrail/admin_routes.py; without it all /admin endpoints 401.
      GOVERNANCE_ADMIN_KEY: test-admin-key
      # Forward allowed SYNTARO webhooks to OpenSymphony. Read by
      # guardrail/webhook_routes.py (OPENSYMPHONY_WEBHOOK_URL); the shipped default
      # http://opensymphony:4000/api/webhook is NOT an OpenSymphony route, so point it
      # at the real webhook controller OpenSymphony exposes (POST /api/v1/stas/webhook → 202).
      OPENSYMPHONY_WEBHOOK_URL: http://opensymphony:4000/api/v1/stas/webhook
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/guardrail/health"]
      interval: 10s
      retries: 15

  # OpenSymphony — the 3rd repo of the integration stack. Built from source for the same
  # reason as governance: the published ghcr.io/aimino-tech/opensymphony image is private,
  # so it cannot be pulled in public CI. Context is ../../OpenSymphony relative to
  # tests/integration/ — a sibling checkout of the OpenSymphony repo (CI checks it out at
  # the workspace root).
  #
  # OpenSymphony's HTTP server binds server.port=4000 (symphony.yml); the healthcheck probes
  # GET /health on that port. It boots with synthetic secrets only — enough to keep the BEAM
  # + HTTP server alive without doing real tracker work in the integration stack.
  opensymphony:
    build:
      context: ../../OpenSymphony
      dockerfile: Dockerfile
    ports:
      - "4004:4000"
    environment:
      # Required by Config.Validator (elixir/lib/symphony_elixir/config/validator.ex) —
      # synthetic value, OpenSymphony does no real Linear work in the integration stack.
      LINEAR_API_KEY: test-key
      DATABASE_URL: postgres://syntaro:syntaro_test_pass@postgres:5432/syntaro_test
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SYMPHONY_ROLE: worker
      # Skip DB migrations at boot — the shared syntaro_test database belongs to SYNTARO, and
      # the webhook/health path under test does not require OS tables.
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
