  <text x="200" y="370" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#6b7280" letter-spacing="6">SOLVING TICKETS AS A SERVICE</text>
