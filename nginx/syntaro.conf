# =============================================================================
# STAS GitHub Webhook Service — Nginx Site Configuration
# =============================================================================
#
# This is a standalone nginx server block for the STAS GitHub webhook service.
# It terminates TLS, rate-limits webhook/API endpoints, proxies to the
# upstream Express webhook server, and exposes health check endpoints.
#
# Usage:
#   Place this file at /etc/nginx/sites-enabled/stas.conf (or include it
#   from your main nginx.conf) on the production server.
#
# For Docker Compose deployments, this file is mounted at:
#   /etc/nginx/conf.d/stas.conf
# =============================================================================

upstream stas-webhook-upstream {
    least_conn;
    server stas-webhook:3000 max_fails=3 fail_timeout=30s;
    # Add additional replicas:
    # server stas-webhook-2:3000 max_fails=3 fail_timeout=30s;
}

# Rate limiting zones (per-IP)
limit_req_zone $binary_remote_addr zone=stas_webhook:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=stas_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=stas_health:10m rate=60r/m;

# TLS session cache
ssl_session_cache shared:STAS_SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name stas.example.com;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

# HTTPS main server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stas.example.com;

    # TLS certificates
    ssl_certificate     /etc/nginx/ssl/stas/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/stas/privkey.pem;

    # Modern TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # JSON structured logging
    log_format stas_json escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_request_id":"$http_x_request_id",'
        '"http_x_github_event":"$http_x_github_event",'
        '"http_x_github_delivery":"$http_x_github_delivery"'
        '}';

    access_log /var/log/nginx/stas-access.log stas_json buffer=32k flush=5s;
    error_log  /var/log/nginx/stas-error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy defaults
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Health check
    location /health {
        limit_req zone=stas_health burst=5 nodelay;
        proxy_pass http://stas-webhook-upstream;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /health/queue {
        limit_req zone=stas_health burst=5 nodelay;
        proxy_pass http://stas-webhook-upstream;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /health/ready {
        limit_req zone=stas_health burst=5 nodelay;
        proxy_pass http://stas-webhook-upstream;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Prometheus metrics
    location /metrics {
        limit_req zone=stas_health burst=5 nodelay;
        proxy_pass http://stas-webhook-upstream;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # GitHub webhook receiver
    location /webhook {
        limit_req zone=stas_webhook burst=10 nodelay;
        proxy_pass http://stas-webhook-upstream;
        client_max_body_size 32m;
        client_body_buffer_size 128k;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Slack events
    location /slack/ {
        limit_req zone=stas_webhook burst=10 nodelay;
        proxy_pass http://stas-webhook-upstream;
        client_max_body_size 4m;
        proxy_read_timeout 30s;
    }

    # Admin API
    location /admin/ {
        limit_req zone=stas_api burst=20 nodelay;
        proxy_pass http://stas-webhook-upstream;
        client_max_body_size 4m;
        proxy_read_timeout 30s;
    }

    # Dashboard API
    location /api/ {
        limit_req zone=stas_api burst=20 nodelay;
        proxy_pass http://stas-webhook-upstream;
        client_max_body_size 4m;
        proxy_read_timeout 30s;
    }

    # Static assets
    location /assets/ {
        proxy_pass http://stas-webhook-upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # GitHub App manifest
    location /github-app-manifest.json {
        proxy_pass http://stas-webhook-upstream;
        add_header Cache-Control "public, max-age=3600";
    }

    # Catch-all
    location / {
        limit_req zone=stas_api burst=20 nodelay;
        proxy_pass http://stas-webhook-upstream;
    }
}
