# =============================================================================
# STAS — Nginx Production Configuration
#
# Features:
#   - Load balancing across stas-webhook replicas (upstream block)
#   - TLS termination with modern ciphers
#   - Rate limiting per IP
#   - Health check endpoint passthrough
#   - Security headers
#   - HTTP/2 support
# =============================================================================

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # -----------------------------------------------------------------------
    # Rate limiting zones
    # -----------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=health_limit:10m rate=60r/m;

    # -----------------------------------------------------------------------
    # Upstream — load balancing across webhook replicas
    # -----------------------------------------------------------------------
    upstream stas-webhook-upstream {
        least_conn;
        server stas-webhook:3000 max_fails=3 fail_timeout=30s;
    }
    # -----------------------------------------------------------------------
    # Basic settings
    # -----------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens   off;

    # -----------------------------------------------------------------------
    # SSL/TLS settings (modern, secure)
    # -----------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id" '
                    '$upstream_addr $upstream_response_time $request_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    # -----------------------------------------------------------------------
    # Security headers (always sent)
    # -----------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -----------------------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # -----------------------------------------------------------------------
    # Server block — HTTP (redirects to HTTPS)
    # -----------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # -----------------------------------------------------------------------
    # Server block — HTTPS (main)
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        # SSL certificates — mount these via docker volume or certbot
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # -------------------------------------------------------------------
        # Health check endpoints — NOT rate limited (monitoring systems)
        # -------------------------------------------------------------------
        location /health {
            limit_req zone=health_limit burst=5 nodelay;
            proxy_pass http://stas-webhook-upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # No caching for health checks
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /health/ready {
            limit_req zone=health_limit burst=5 nodelay;
            proxy_pass http://stas-webhook-upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # -------------------------------------------------------------------
        # Webhook endpoints — rate limited per IP
        # -------------------------------------------------------------------
        location /webhook {
            limit_req zone=webhook_limit burst=10 nodelay;

            proxy_pass http://stas-webhook-upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Webhooks can be large (GitHub payloads)
            client_max_body_size 32m;
            client_body_buffer_size 128k;

            # Longer timeout for webhook processing
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # No buffering for real-time events
            proxy_buffering off;
        }

        # -------------------------------------------------------------------
        # API endpoints — moderate rate limiting
        # -------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://stas-webhook-upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            client_max_body_size 4m;
            proxy_read_timeout 30s;
        }

        # -------------------------------------------------------------------
        # Slack events endpoint
        # -------------------------------------------------------------------
        location /slack/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://stas-webhook-upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # -------------------------------------------------------------------
        # Flower (Celery monitoring) — optionally expose behind auth
        # -------------------------------------------------------------------
        location /flower/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://stas-flower:5555/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Optional: basic auth for Flower (uncomment to enable)
            # auth_basic "Celery Monitor";
            # auth_basic_user_file /etc/nginx/.htpasswd;
        }

        # -------------------------------------------------------------------
        # Everything else
        # -------------------------------------------------------------------
        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://stas-webhook-upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
