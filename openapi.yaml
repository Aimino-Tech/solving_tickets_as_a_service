  # ──────────────────────────────────────────────────────────────────────────
  # RapidAPI — Health
  # ──────────────────────────────────────────────────────────────────────────
  /api/health:
    get:
      tags:
        - Health
      summary: RapidAPI health check
      description: |
        Public health check endpoint for the RapidAPI service.
        Returns service status and current timestamp.
      operationId: getRapidApiHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RapidApiHealthResponse"
              example:
                status: "ok"
                service: "SYNTARO RapidAPI"
                timestamp: "2026-06-12T12:00:00.000Z"

components:
  securitySchemes:
    RapidAPIKey:
      type: apiKey
      in: header
      name: X-RapidAPI-Key
      description: |
        API key for the RapidAPI Marketplace. Subscribe to a plan at
        https://rapidapi.com/ to get your API key.
        
        Pass the key in the `X-RapidAPI-Key` header with every request to
        RapidAPI-protected endpoints.
        
        **Rate limit headers** are returned with every response:
        - `X-RateLimit-Limit` — Maximum requests per window (based on plan)
        - `X-RateLimit-Remaining` — Requests remaining in current window
        - `X-RateLimit-Plan` — Your current plan tier
    
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        API key or user token provided in the Authorization header.
    AdminKey:
      type: apiKey
      in: header
      name: x-admin-key
      description: |
        Admin API key provided in the x-admin-key header.
        Must match the configured ADMIN_API_KEY environment variable.

  schemas:
    # ── Health ──────────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        label:
          type: string
          description: The configured issue label that triggers SYNTARO
          example: "syntaro:fix"
        uptime:
          type: number
          description: Server uptime in seconds
          example: 12345.67
        timestamp:
          type: string
          format: date-time
          description: Current server timestamp
      required:
        - status
        - label
        - uptime
        - timestamp

    WorkersHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall worker health status
        totalWorkers:
          type: integer
          description: Total number of tracked workers
        aliveWorkers:
          type: integer
          description: Number of workers with recent heartbeats
        deadWorkers:
          type: integer
          description: Number of workers without recent heartbeats
        workers:
          type: array
          items:
            $ref: "#/components/schemas/WorkerHeartbeatEntry"
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - totalWorkers
        - aliveWorkers
        - deadWorkers
        - workers
        - timestamp

    WorkerHeartbeatEntry:
      type: object
      properties:
        workerId:
          type: string
          description: Unique worker identifier (e.g., hostname:pid)
        lastHeartbeat:
          type: string
          format: date-time
          description: ISO timestamp of the last heartbeat
        isAlive:
          type: boolean
          description: Whether the worker is considered alive (heartbeat within 2 minutes)
        secondsSinceHeartbeat:
          type: integer
          description: Seconds elapsed since the last heartbeat
      required:
        - workerId
        - lastHeartbeat
        - isAlive
        - secondsSinceHeartbeat

    DependenciesHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall dependency health status
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyCheckResult"
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - dependencies
        - timestamp

    DependencyCheckResult:
      type: object
      properties:
        name:
          type: string
          description: Dependency name (e.g., database, redis, rabbitmq, opencode, sentry)
        status:
          type: string
          enum: [ok, error, disabled]
          description: Health status of the dependency
        error:
          type: string
          description: Error message if status is error
        latencyMs:
          type: integer
          description: Response latency in milliseconds (if applicable)
      required:
        - name
        - status

    # ── Error Responses ────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        details:
          type: array
          items:
            type: string
          description: Detailed error information (optional)
      required:
        - error

    # ── Webhook ────────────────────────────────────────────────────────────
    WebhookAcceptedResponse:
      type: object
      properties:
        accepted:
          type: boolean
          example: true
      required:
        - accepted

    GitHubWebhookPayload:
      type: object
      description: GitHub webhook payload. Structure varies by event type.
      properties:
        action:
          type: string
          example: "labeled"
        issue:
          type: object
          properties:
            number:
              type: integer
            title:
              type: string
            body:
              type: string
            labels:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
        repository:
          type: object
          properties:
            full_name:
              type: string
            owner:
              type: object
              properties:
                login:
                  type: string
            name:
              type: string
        installation:
          type: object
          properties:
            id:
              type: integer

    GitLabWebhookPayload:
      type: object
      description: GitLab webhook payload. Structure varies by event type.
      properties:
        event_name:
          type: string
          example: "push"
        ref:
          type: string
          example: "refs/heads/main"
        project:
          type: object
          properties:
            id:
              type: integer
            path_with_namespace:
              type: string

    BitbucketWebhookPayload:
      type: object
      description: Bitbucket webhook payload. Structure varies by event type.
      properties:
        push:
          type: object
          properties:
            changes:
              type: array
              items:
                type: object
        repository:
          type: object
          properties:
            full_name:
              type: string

    LinearWebhookPayload:
      type: object
      description: Linear webhook payload. Structure varies by event type.
      properties:
        action:
          type: string
          example: "create"
        type:
          type: string
          example: "Issue"
        data:
          type: object
          properties:
            id:
              type: string
              example: "abc-123"
            title:
              type: string
            description:
              type: string
            state:
              type: string

    JiraWebhookPayload:
      type: object
      description: Jira webhook payload. Structure varies by event type.
      properties:
        timestamp:
          type: integer
          description: Event timestamp in milliseconds
        webhookEvent:
          type: string
          example: "jira:issue_created"
        issue:
          type: object
          properties:
            id:
              type: string
            key:
              type: string
              example: "PROJ-123"
            fields:
              type: object
              properties:
                summary:
                  type: string
                description:
                  type: object

    SlackEventBody:
      type: object
      description: |
        Slack Events API payload. Used for URL verification challenge, event callbacks,
        and interactive message actions.
      properties:
        type:
          type: string
          example: "url_verification"
        challenge:
          type: string
          description: URL verification challenge string
        event:
          type: object
          description: Slack event object (present in event_callback type)
        token:
          type: string

    # ── Credits ─────────────────────────────────────────────────────────────
    CreditBalance:
      type: object
      properties:
        id:
          type: integer
        account_id:
          type: integer
        balance:
          type: integer
          description: Current credit balance
        lifetime_credits:
          type: integer
          description: Total credits ever earned
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - account_id
        - balance
        - lifetime_credits

    CreditTransaction:
      type: object
      properties:
        id:
          type: integer
        account_id:
          type: integer
        amount:
          type: integer
          description: Positive for credits added, negative for deductions
        type:
          type: string
          enum: [purchase, usage, refund, adjustment]
        description:
          type: string
          nullable: true
        stripe_payment_intent_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - account_id
        - amount
        - type
        - created_at

    CreditTopUpRequest:
      type: object
      required:
        - price_id
        - success_url
        - cancel_url
      properties:
        price_id:
          type: string
          description: Stripe Price ID for the desired credit pack
          example: "price_100credits"
        success_url:
          type: string
          format: uri
          description: Redirect URL on successful payment
          example: "https://app.syntaro.ai/credits/success"
        cancel_url:
          type: string
          format: uri
          description: Redirect URL if the user cancels
          example: "https://app.syntaro.ai/credits"

    CreditTopUpResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Stripe Checkout session URL for redirect
        session_id:
          type: string
          description: Stripe Checkout session ID
      required:
        - url
        - session_id

    # ── Usage ───────────────────────────────────────────────────────────────
    CreditUsageResponse:
      type: object
      properties:
        accountId:
          type: integer
          description: The authenticated account ID
        period:
          type: string
          enum: [daily, weekly, monthly]
          description: Aggregation period
        usage:
          type: array
          items:
            $ref: "#/components/schemas/UsagePeriod"
      required:
        - accountId
        - period
        - usage

    UsagePeriod:
      type: object
      properties:
        periodStart:
          type: string
          format: date-time
          description: Start of the aggregation period
        totalCredits:
          type: integer
          description: Total credits consumed in this period
        totalTransactions:
          type: integer
          description: Number of deduction transactions in this period
      required:
        - periodStart
        - totalCredits
        - totalTransactions

    AdminCreditAdjustRequest:
      type: object
      required:
        - accountId
        - amount
      properties:
        accountId:
          type: integer
          description: Account ID to adjust
          example: 42
        amount:
          type: integer
          description: >
            Credit amount. Positive values credit the account (add credits).
            Negative values debit the account (deduct credits). Must not be zero.
          example: 500
        description:
          type: string
          description: Reason for the adjustment
          example: "Customer compensation for outage"
        type:
          type: string
          enum: [purchase, refund, adjustment]
          default: adjustment
          description: Transaction type

    AdminCreditAdjustResponse:
      type: object
      properties:
        accountId:
          type: integer
        newBalance:
          type: integer
          description: Account balance after adjustment
        amount:
          type: integer
          description: Amount applied (positive = credit, negative = debit)
        type:
          type: string
        description:
          type: string
          nullable: true
      required:
        - accountId
        - newBalance
        - amount
        - type
            credits:
              type: number
            runs:
              type: number
        forecast:
          type: object
          properties:
            endOfMonthCredits:
              type: integer
            endOfMonthRuns:
              type: integer
            projectedRemainingCredits:
              type: integer
        freeTier:
          type: object
          properties:
            limit:
              type: integer
            wouldExceed:
              type: boolean
            estimatedOverage:
              type: integer
      required:
        - forecastDate
        - month

    # ── User ────────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
          nullable: true
        name:
          type: string
          nullable: true
        tier:
          type: string
          enum: [free, pro, enterprise]
        github_installation_id:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
        - id
        - tier
        - github_installation_id

    UserUsage:
      type: object
      properties:
        totalRuns:
          type: integer
        totalCreditsUsed:
          type: integer
        monthlyCreditsUsed:
          type: integer
        monthlyRuns:
          type: integer
        freeTierRemaining:
          type: integer
          nullable: true
        tier:
          type: string
      required:
        - totalRuns
        - totalCreditsUsed
        - tier

    # ── Admin ───────────────────────────────────────────────────────────────
    AdminHealth:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        uptime:
          type: number
        version:
          type: string
        node_env:
          type: string
        database:
          type: string
          example: "connected"
        redis:
          type: string
          example: "connected"
        queue_backend:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - uptime

    AdminStats:
      type: object
      properties:
        totalAccounts:
          type: integer
        totalFixRuns:
          type: integer
        totalCreditsIssued:
          type: integer
        totalCreditsUsed:
          type: integer
        activeAccountsThisMonth:
          type: integer
        averageCreditsPerRun:
          type: number
        prSuccessRate:
          type: number
        topSources:
          type: object
          additionalProperties:
            type: integer

    AdminAccount:
      type: object
      properties:
        id:
          type: integer
        github_installation_id:
          type: integer
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        tier:
          type: string
          enum: [free, pro, enterprise]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - github_installation_id
        - tier

    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
        account_id:
          type: integer
        action:
          type: string
        details:
          type: string
          nullable: true
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - account_id
        - action

    WebhookEvent:
      type: object
      properties:
        id:
          type: integer
        source:
          type: string
          enum: [github, gitlab, bitbucket, stripe, slack, linear, jira]
        event_type:
          type: string
        payload:
          type: object
        processed:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
        - id
        - source
        - event_type
        - processed

    # ── Feature Flags ───────────────────────────────────────────────────────
    FeatureFlag:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        account_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
      required:
        - name
        - enabled

    FeatureFlagPutBody:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Whether the feature flag should be enabled
        account_id:
          type: integer
          description: Optional account ID for account-specific overrides


    # ── RapidAPI ──────────────────────────────────────────────────────────────
    RapidApiHealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        service:
          type: string
          example: "SYNTARO RapidAPI"
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - service
        - timestamp

    FixRequest:
      type: object
      required:
        - repoUrl
        - issueTitle
        - issueBody
      properties:
        repoUrl:
          type: string
          format: uri
          description: GitHub repository URL
          example: "https://github.com/owner/repo"
        issueTitle:
          type: string
          maxLength: 500
          description: Issue title
          example: "Fix login bug"
        issueBody:
          type: string
          maxLength: 50000
          description: Issue body / description
          example: "The login endpoint returns 500 when the email contains special characters."
        language:
          type: string
          maxLength: 50
          description: Optional language hint
          example: "typescript"

    FixResponse:
      type: object
      required:
        - jobId
        - status
        - pollUrl
        - createdAt
      properties:
        jobId:
          type: string
          format: uuid
          description: UUID identifying the fix job
        status:
          type: string
          enum: [queued]
          description: Initial job status
        pollUrl:
          type: string
          format: uri
          description: URL to poll for job status updates
        createdAt:
          type: string
          format: date-time
          description: ISO timestamp of job creation

    JobStatusResponse:
      type: object
      required:
        - jobId
        - status
        - createdAt
        - updatedAt
      properties:
        jobId:
          type: string
          format: uuid
          description: UUID of the job
        status:
          type: string
          enum: [queued, running, completed, failed]
          description: Current job status
        error:
          type: string
          description: Error message (only present when status is "failed")
        resultUrl:
          type: string
          format: uri
          description: Result URL for the fix (only when status is "completed")
        prUrl:
          type: string
          format: uri
          description: GitHub PR URL if a pull request was created
        evalScore:
          type: number
          minimum: 0
          maximum: 100
          description: Eval score (0-100) if the fix was evaluated
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    EvalCategoryScore:
      type: object
      properties:
        category:
          type: string
          example: "typescript"
        total:
          type: integer
          description: Number of test cases in this category
        passed:
          type: integer
          description: Number of passed test cases
        passRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Pass rate as a decimal
        averageScore:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Average score (0-100)

    EvalResults:
      type: object
      properties:
        overallPassRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Overall pass rate
        totalTests:
          type: integer
          description: Total number of test cases
        passedTests:
          type: integer
          description: Number of passed test cases
        failedTests:
          type: integer
          description: Number of failed test cases
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EvalCategoryScore"
        trend:
          type: array
          items:
            type: number
          description: Pass rate trend data (last N runs)
        timestamp:
          type: string
          format: date-time

    LatestEvalRun:
      type: object
      properties:
        runId:
          type: string
          description: Unique eval run ID
        timestamp:
          type: string
          format: date-time
        overallPassRate:
          type: number
          format: float
        results:
          type: array
          items:
            type: object
            properties:
              testCase:
                type: string
              category:
                type: string
              passed:
                type: boolean
              score:
                type: number
              durationMs:
                type: integer
              error:
                type: string
                nullable: true
        categorySummary:
          type: array
          items:
            $ref: "#/components/schemas/EvalCategoryScore"
        trend:
          type: object
          properties:
            previousPassRate:
              type: number
              format: float
            change:
              type: number
              format: float
              description: Positive value means improvement

  responses:
    WebhookAccepted:
      description: Webhook accepted for processing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebhookAcceptedResponse"
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RapidAPIRateLimited:
      description: Rate limit exceeded for your RapidAPI plan tier
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per window for your plan
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Requests remaining in current window
        X-RateLimit-Plan:
          schema:
            type: string
          description: Your current plan tier (free, pro, enterprise)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Rate limit exceeded"
              plan:
                type: string
                example: "free"
              limit:
                type: integer
                example: 10
              remaining:
                type: integer
                example: 0
              resetAt:
                type: string
                format: date-time

    RateLimited:
      description: Too many requests — rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per window
        RateLimit-Remaining:
          schema:
            type: integer
          description: Requests remaining in current window
        RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when the window resets
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Too many requests"
              retryAfter:
                type: string
                description: See Retry-After header
