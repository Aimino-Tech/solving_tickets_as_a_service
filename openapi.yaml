openapi: 3.1.0
info:
  title: SYNTARO API — SYNTARO
  description: |
    SYNTARO is an open-source GitHub bot that turns labeled issues into pull requests.

    ## RapidAPI Marketplace
    
    SYNTARO is also available as a payable API on the [RapidAPI Marketplace](https://rapidapi.com/).
    Subscribe to a plan to get an API key and start submitting fix jobs programmatically.
    
    Endpoints marked with the `RapidAPI` tag require a valid RapidAPI subscription.
    Use `X-RapidAPI-Key` header for authentication and `X-RapidAPI-Proxy-Secret` for proxy validation.
    
    ### Rate Limiting (RapidAPI)
    
    RapidAPI subscribers are rate-limited by plan tier:
    - **Free**: 10 requests/day
    - **Pro**: 100 requests/day
    - **Enterprise**: 1000 requests/day
    
    Rate limit headers are returned with every response:
    - `X-RateLimit-Limit` — Maximum requests per window
    - `X-RateLimit-Remaining` — Requests remaining in the current window
    - `X-RateLimit-Plan` — Your current plan tier
    - `Retry-After` — Seconds to wait before retrying (only on 429 responses)
    
    ### Example Curl
    
    ```bash
    # Submit a fix job
    curl -X POST https://syntaro-rapidapi.p.rapidapi.com/api/fix \
      -H "Content-Type: application/json" \
      -H "X-RapidAPI-Key: your-rapidapi-key" \
      -H "X-RapidAPI-Proxy-Secret: your-proxy-secret" \
      -d '{"repoUrl": "https://github.com/owner/repo", "issueTitle": "Fix login bug", "issueBody": "Login returns 500 for special chars"}'
    
    # Poll job status
    curl https://syntaro-rapidapi.p.rapidapi.com/api/fix/<jobId> \
      -H "X-RapidAPI-Key: your-rapidapi-key" \
      -H "X-RapidAPI-Proxy-Secret: your-proxy-secret"
    ```
    This API powers the webhook receiver, credit management, usage metering, and admin dashboard.

    ## Authentication

    ### Webhook Signatures
    Each webhook source uses its own verification method:
    - **GitHub**: `X-Hub-Signature-256` (HMAC-SHA256)
    - **GitLab**: `X-GitLab-Token`
    - **Bitbucket**: `X-Hub-Signature` (HMAC-SHA1)
    - **Linear**: `Linear-Signature` (HMAC-SHA256)
    - **Jira**: `X-Hub-Signature-256` (HMAC-SHA256)
    - **Stripe**: `Stripe-Signature` (Stripe's `constructEvent`)

    ### Admin API
    Admin endpoints require a Bearer token in the `Authorization` header:
    ```
    Authorization: Bearer <admin-api-token>
    ```

    ### User API
    User endpoints require authentication via the account's API key:
    ```
    Authorization: Bearer <user-api-key>
    ```

    ## Rate Limiting
    Webhook routes are rate-limited to 30 requests per 60-second sliding window.
    The response includes standard rate limit headers (`RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset`).
    When exceeded, the API returns `429 Too Many Requests` with a `Retry-After` header.
  version: "0.1.0"
  contact:
    name: SYNTARO Team
    url: https://github.com/tamnguyen08/solving_tickets_as_a_service
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.syntaro.ai
    description: Production server
  - url: http://localhost:3000
    description: Local development

tags:
  - name: RapidAPI
    description: RapidAPI Marketplace endpoints (requires subscription)
  - name: Eval
    description: Public eval results for SYNTARO benchmark performance
  - name: Health
    description: Health check endpoints
  - name: Webhooks
    description: Webhook receivers for various platforms
  - name: Credits
    description: Credit balance and transaction management
  - name: Usage
    description: Usage metering and statistics
  - name: User
    description: User account endpoints
  - name: Admin
    description: Admin-only endpoints for system management
  - name: Feature Flags
    description: Feature flag management

paths:
  # ──────────────────────────────────────────────────────────────────────────
  # Health
  # ──────────────────────────────────────────────────────────────────────────
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the current health status of the SYNTARO API server.
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                label: "syntaro:fix"
                uptime: 12345.67
                timestamp: "2026-06-05T20:00:00.000Z"
        "500":
          $ref: "#/components/responses/InternalError"

  /health/workers:
    get:
      tags:
        - Health
      summary: Worker health status
      description: Returns the heartbeat status of all registered worker processes.
      operationId: getWorkersHealth
      responses:
        "200":
          description: Worker status information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkersHealthResponse"
              example:
                status: "ok"
                totalWorkers: 2
                aliveWorkers: 2
                deadWorkers: 0
                workers:
                  - workerId: "worker-host-1:12345"
                    lastHeartbeat: "2026-06-09T10:00:00.000Z"
                    isAlive: true
                    secondsSinceHeartbeat: 15
                  - workerId: "worker-host-2:12346"
                    lastHeartbeat: "2026-06-09T10:00:05.000Z"
                    isAlive: true
                    secondsSinceHeartbeat: 10
                timestamp: "2026-06-09T10:00:20.000Z"
        "500":
          $ref: "#/components/responses/InternalError"

  /health/dependencies:
    get:
      tags:
        - Health
      summary: External dependency health
      description: Returns the health status of all external service dependencies (database, Redis, RabbitMQ, OpenCode, Sentry).
      operationId: getDependenciesHealth
      responses:
        "200":
          description: Dependency health information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependenciesHealthResponse"
              example:
                status: "ok"
                dependencies:
                  - name: "database"
                    status: "ok"
                    latencyMs: 3
                  - name: "redis"
                    status: "ok"
                    latencyMs: 2
                  - name: "rabbitmq"
                    status: "ok"
                    latencyMs: 1
                  - name: "opencode"
                    status: "ok"
                  - name: "sentry"
                    status: "disabled"
                timestamp: "2026-06-09T10:00:20.000Z"
        "503":
          description: One or more dependencies are unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependenciesHealthResponse"
              example:
                status: "degraded"
                dependencies:
                  - name: "database"
                    status: "ok"
                    latencyMs: 3
                  - name: "redis"
                    status: "error"
                    error: "connect ECONNREFUSED 127.0.0.1:6379"
                  - name: "rabbitmq"
                    status: "ok"
                    latencyMs: 1
                  - name: "opencode"
                    status: "error"
                    error: "circuit=open, failures=3, http=503"
                  - name: "sentry"
                    status: "disabled"
                timestamp: "2026-06-09T10:00:20.000Z"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────────────────────────────────
  # Webhooks — GitHub
  # ──────────────────────────────────────────────────────────────────────────
  /webhook/github:
    post:
      tags:
        - Webhooks
      summary: GitHub webhook receiver
      description: |
        Receives webhook events from GitHub. Supports all GitHub webhook event types
        (issues, pull requests, push, etc.). The payload is verified using the
        `X-Hub-Signature-256` header (HMAC-SHA256).

        Also available at the legacy `/webhook` path for backward compatibility.
      operationId: postWebhookGithub
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
          description: GitHub event type (e.g., `issues.labeled`, `push`, `pull_request`)
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Unique delivery identifier
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature of the raw request body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubWebhookPayload"
            examples:
              issueLabeled:
                summary: Issue labeled event
                value:
                  action: labeled
                  issue:
                    number: 42
                    title: "Fix login bug"
                    body: "The login endpoint returns 500 when the email contains special characters."
                    labels:
                      - name: "syntaro:fix"
                  repository:
                    full_name: "owner/repo"
                    owner:
                      login: "owner"
                    name: "repo"
                  installation:
                    id: 12345
      responses:
        "202":
          description: Webhook accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcceptedResponse"
              example:
                accepted: true
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  # Legacy /webhook endpoint (same handler as /webhook/github)
  /webhook:
    post:
      tags:
        - Webhooks
      summary: Legacy GitHub webhook receiver
      description: |
        Legacy webhook endpoint — identical behavior to `POST /webhook/github`.
        Included for backward compatibility.
      operationId: postWebhookLegacy
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
          description: GitHub event type
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubWebhookPayload"
      responses:
        "202":
          $ref: "#/components/responses/WebhookAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ──────────────────────────────────────────────────────────────────────────
  # Webhooks — GitLab
  # ──────────────────────────────────────────────────────────────────────────
  /webhook/gitlab:
    post:
      tags:
        - Webhooks
      summary: GitLab webhook receiver
      description: |
        Receives webhook events from GitLab. The payload is verified using the
        `X-GitLab-Token` header against the configured webhook secret.
      operationId: postWebhookGitlab
      parameters:
        - name: X-GitLab-Event
          in: header
          required: true
          schema:
            type: string
          description: GitLab event type (e.g., `Push Hook`, `Issue Hook`, `Merge Request Hook`)
        - name: X-GitLab-Token
          in: header
          required: false
          schema:
            type: string
          description: GitLab webhook token for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitLabWebhookPayload"
            examples:
              pushEvent:
                summary: Push event
                value:
                  event_name: push
                  ref: refs/heads/main
                  project:
                    id: 123
                    path_with_namespace: owner/repo
                  commits:
                    - id: abc123
                      message: "Fix bug"
      responses:
        "202":
          $ref: "#/components/responses/WebhookAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ──────────────────────────────────────────────────────────────────────────
  # Webhooks — Bitbucket
  # ──────────────────────────────────────────────────────────────────────────
  /webhook/bitbucket:
    post:
      tags:
        - Webhooks
      summary: Bitbucket webhook receiver
      description: |
        Receives webhook events from Bitbucket. The payload is verified using the
        `X-Hub-Signature` header (HMAC-SHA1).
      operationId: postWebhookBitbucket
      parameters:
        - name: X-Hub-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA1 signature of the raw request body
        - name: X-Event-Key
          in: header
          required: false
          schema:
            type: string
          description: Bitbucket event key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BitbucketWebhookPayload"
            examples:
              repoPush:
                summary: Repository push
                value:
                  push:
                    changes:
                      - new:
                          name: main
                          type: branch
                  repository:
                    full_name: owner/repo
      responses:
        "202":
          $ref: "#/components/responses/WebhookAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ──────────────────────────────────────────────────────────────────────────
  # Webhooks — Linear
  # ──────────────────────────────────────────────────────────────────────────
  /webhook/linear:
    post:
      tags:
        - Webhooks
      summary: Linear webhook receiver
      description: |
        Receives webhook events from Linear. The payload is verified using the
        `Linear-Signature` header (HMAC-SHA256).
      operationId: postWebhookLinear
      parameters:
        - name: Linear-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature of the raw request body
        - name: Linear-Event
          in: header
          required: false
          schema:
            type: string
          description: Linear event type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinearWebhookPayload"
            examples:
              issueCreated:
                summary: Issue created
                value:
                  action: create
                  data:
                    id: abc-123
                    title: "Fix login bug"
                    description: "The login endpoint is broken"
                    state: triage
                  type: Issue
      responses:
        "202":
          $ref: "#/components/responses/WebhookAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ──────────────────────────────────────────────────────────────────────────
  # Webhooks — Jira
  # ──────────────────────────────────────────────────────────────────────────
  /webhook/jira:
    post:
      tags:
        - Webhooks
      summary: Jira webhook receiver
      description: |
        Receives webhook events from Jira. The payload is verified using the
        `X-Hub-Signature-256` header (HMAC-SHA256).
      operationId: postWebhookJira
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature of the raw request body
        - name: X-Event-Key
          in: header
          required: false
          schema:
            type: string
          description: Jira event key (e.g., `jira:issue_created`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JiraWebhookPayload"
            examples:
              issueCreated:
                summary: Issue created
                value:
                  timestamp: 1717622400000
                  webhookEvent: jira:issue_created
                  issue:
                    id: "10001"
                    key: "PROJ-123"
                    fields:
                      summary: "Fix login bug"
                      description:
                        type: doc
                        version: 1
                        content:
                          - type: paragraph
                            content:
                              - text: "The login endpoint is broken"
                                type: text
      responses:
        "202":
          $ref: "#/components/responses/WebhookAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ──────────────────────────────────────────────────────────────────────────
  # Webhooks — Stripe
  # ──────────────────────────────────────────────────────────────────────────
  /webhook/stripe:
    post:
      tags:
        - Webhooks
      summary: Stripe webhook receiver
      description: |
        Receives webhook events from Stripe for credit purchase processing.
        Verifies the event using Stripe's signature verification (`Stripe-Signature` header).
        Handles events such as `checkout.session.completed`, `invoice.paid`,
        `invoice.payment_failed`, `customer.subscription.updated`, and
        `customer.subscription.deleted`.
      operationId: postWebhookStripe
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
          description: Stripe webhook signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: Stripe event type
                  example: checkout.session.completed
                data:
                  type: object
                  properties:
                    object:
                      type: object
              description: Raw Stripe event object
      responses:
        "200":
          description: Webhook received and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────────────────────────────────
  # Slack Events
  # ──────────────────────────────────────────────────────────────────────────
  /slack/events:
    post:
      tags:
        - Webhooks
      summary: Slack events receiver
      description: |
        Receives Slack Events API payloads (interactive messages, slash commands,
        and event subscriptions) via the Slack Bolt framework.
      operationId: postSlackEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlackEventBody"
      responses:
        "200":
          description: Event acknowledged (Slack expects 200 for URL verification and event ack)
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                    description: URL verification challenge token
        "400":
          $ref: "#/components/responses/BadRequest"

  # ──────────────────────────────────────────────────────────────────────────
  # Credits — Balance
  # ──────────────────────────────────────────────────────────────────────────
  /api/v1/credits/balance:
    get:
      tags:
        - Credits
      summary: Get credit balance
      description: Returns the current credit balance for the authenticated account.
      operationId: getCreditBalance
      security:
        - BearerToken: []
      responses:
        "200":
          description: Current credit balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"
              example:
                account_id: 1
                balance: 2500
                lifetime_credits: 5000
                created_at: "2026-01-01T00:00:00.000Z"
                updated_at: "2026-06-05T20:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────────────────────────────────
  # Credits — Transactions
  # ──────────────────────────────────────────────────────────────────────────
  /api/v1/credits/transactions:
    get:
      tags:
        - Credits
      summary: List credit transactions
      description: |
        Returns the transaction history for the authenticated account.
        Results are paginated with the newest transactions first.
      operationId: getCreditTransactions
      security:
        - BearerToken: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Maximum number of transactions to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of transactions to skip
      responses:
        "200":
          description: List of credit transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditTransaction"
              example:
                - id: 1
                  account_id: 1
                  amount: 100
                  type: purchase
                  description: "Purchased 100 Credits"
                  stripe_payment_intent_id: pi_abc123
                  created_at: "2026-06-05T19:00:00.000Z"
                - id: 2
                  account_id: 1
                  amount: -50
                  type: usage
                  description: "Fix run for issue #42"
                  stripe_payment_intent_id: null
                  created_at: "2026-06-04T12:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────────────────────────────────
  # Credits — Top-Up
  # ──────────────────────────────────────────────────────────────────────────
  /api/v1/credits/top-up:
    post:
      tags:
        - Credits
      summary: Top up credits
      description: |
        Creates a Stripe Checkout session for purchasing additional credits.
        Redirects the user to the Stripe Checkout page for payment completion.
      operationId: postCreditTopUp
      security:
        - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditTopUpRequest"
            examples:
              smallPack:
                summary: Purchase 100 credits
                value:
                  price_id: price_100credits
                  success_url: "https://app.syntaro.ai/credits/success"
                  cancel_url: "https://app.syntaro.ai/credits"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditTopUpResponse"
              example:
                url: "https://checkout.stripe.com/c/pay/cs_test_abc123"
                session_id: "cs_test_abc123"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────────────────────────────────
  # Credits — Usage
  # ──────────────────────────────────────────────────────────────────────────
  /api/v1/credits/usage:
    get:
      tags:
        - Credits
      summary: Credit usage statistics
      description: |
        Returns credit consumption statistics for the authenticated account,
        aggregated by day, week, or month. Only deduction transactions
        (negative amounts) are included.
      operationId: getCreditUsage
      security:
        - BearerToken: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: monthly
          description: Aggregation period
      responses:
        "200":
          description: Usage statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditUsageResponse"
              example:
                accountId: 42
                period: "monthly"
                usage:
                  - periodStart: "2026-01-01T00:00:00.000Z"
                    totalCredits: 150
                    totalTransactions: 3
                  - periodStart: "2026-02-01T00:00:00.000Z"
                    totalCredits: 200
                    totalTransactions: 4
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────────────────────────────────
  # Admin — Credit Adjust
  # ──────────────────────────────────────────────────────────────────────────
  /api/v1/admin/credits/adjust:
    post:
      tags:
        - Admin
      summary: Adjust account credits
      description: |
        Admin-only endpoint to manually add or remove credits from an account.
        Requires `x-admin-key` header matching the configured `ADMIN_API_KEY`.
        Positive amounts credit the account; negative amounts debit it.
      operationId: postAdminCreditAdjust
      parameters:
        - name: x-admin-key
          in: header
          required: true
          schema:
            type: string
          description: Admin API key for authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreditAdjustRequest"
            examples:
              credit:
                summary: Credit account
                value:
                  accountId: 42
                  amount: 500
                  description: "Customer compensation"
                  type: adjustment
              debit:
                summary: Debit account
                value:
                  accountId: 42
                  amount: -100
                  description: "Usage correction"
                  type: adjustment
      responses:
        "200":
          description: Credit adjustment applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreditAdjustResponse"
              example:
                accountId: 42
                newBalance: 2000
                amount: 500
                type: adjustment
                description: "Customer compensation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Insufficient credits for debit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Insufficient credits"
