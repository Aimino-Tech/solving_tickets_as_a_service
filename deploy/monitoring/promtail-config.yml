# =============================================================================
# Promtail Configuration — STAS Log Aggregation
# =============================================================================
# Scrapes Docker container logs, attaches container-name and compose-service
# labels, and ships them to Loki.
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values:
              - com.docker.compose.project=stas
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.+)"
        target_label: "container_name"
      - source_labels: ["__meta_docker_container_id"]
        target_label: "container_id"
      - source_labels: ["__meta_docker_image_name"]
        target_label: "image_name"
      - source_labels: ["__meta_docker_compose_service"]
        target_label: "compose_service"
      - source_labels: ["__meta_docker_compose_project"]
        target_label: "compose_project"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "log_stream"
      - action: labelmap
        regex: "__meta_docker_container_label_(.+)"

  - job_name: docker-logs
    static_configs:
      - targets: ["localhost"]
        labels:
          job: docker-logs
          __path__: /var/log/docker/*.log

  - job_name: system-logs
    static_configs:
      - targets: ["localhost"]
        labels:
          job: system
          __path__: /var/log/syslog

pipeline_stages:
  - timestamp:
      source: time
      format: RFC3339Nano
  - regex:
      expression: "^(?P<level>\\w+)\\s+(?P<message>.*)$"
  - labels:
      level:
  - output:
      source: message
