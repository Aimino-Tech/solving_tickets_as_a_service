# SYNTARO External Uptime Monitoring Configuration

monitors:
  - name: "SYNTARO /health - Core Liveness"
    type: "http"
    url: "https://api.syntaro.io/health"
    check_interval: 30
    regions: ["us-east-1", "eu-west-1", "ap-southeast-1"]
    http_method: "GET"
    expected_status_code: 200
    paused: false

  - name: "SYNTARO /health/queue - Queue Health"
    type: "http"
    url: "https://api.syntaro.io/health/queue"
    check_interval: 60
    regions: ["us-east-1", "eu-west-1"]
    http_method: "GET"
    expected_status_code: 200
    paused: false

  - name: "SYNTARO /api/pricing - Pricing API"
    type: "http"
    url: "https://api.syntaro.io/api/pricing"
    check_interval: 300
    regions: ["us-east-1", "eu-west-1"]
    http_method: "GET"
    expected_status_code: 200
    paused: false

  - name: "SYNTARO Website - syntaro.io"
    type: "http"
    url: "https://syntaro.io/"
    check_interval: 300
    regions: ["us-east-1", "eu-west-1", "ap-southeast-1"]
    http_method: "GET"
    expected_status_code: 200
    paused: false

  - name: "SYNTARO Synthetic E2E - Full Pipeline"
    type: "heartbeat"
    url: "https://api.syntaro.io/monitoring/synthetic-heartbeat"
    check_interval: 300
    grace_period: 120
    paused: false
