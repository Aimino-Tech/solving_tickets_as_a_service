<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="60" fill="url(#bg)"/>
  <!-- Ticket/checkmark icon -->
  <rect x="80" y="100" width="240" height="200" rx="20" fill="url(#accent)" opacity="0.15"/>
  <rect x="100" y="120" width="200" height="160" rx="12" fill="#e94560" opacity="0.3"/>
  <!-- Checkmark -->
  <path d="M160 220 L185 245 L240 180" stroke="#53d769" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Text line placeholders -->
  <rect x="110" y="300" width="180" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
  <rect x="140" y="318" width="120" height="4" rx="2" fill="#ffffff" opacity="0.25"/>
  <!-- S -->
  <text x="200" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#53d769">STAS</text>
</svg>
